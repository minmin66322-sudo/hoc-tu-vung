<style>
/* Layout: một cột kiểu sổ tay — mỗi chủ đề là một chương trong năm đầu của Linh ở Seattle; từ mới tô dạ quang như bút highlight */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --ink:#14221D; --muted:#5A6A64; --line:#D3DCD8;
  --accent:#1D5A46; --accent-ink:#FFFFFF; --rain:#3E6F86;
  --hl:#FFE27A; --hl-ink:#14221D; --good:#2C7A4D; --bad:#B23F2C; --soft:#E2EAE6; --ana:#A3416D; --gold:#8A5B00;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-read:"Charis SIL", "Noto Serif", Georgia, serif;
  --f-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1614; --surface:#16211E; --ink:#E4EDE9; --muted:#93A59E; --line:#26342F;
  --accent:#6CC2A0; --accent-ink:#0E1614; --rain:#86B6CC;
  --hl:#5A4A12; --hl-ink:#FFEAA6; --good:#6CC28A; --bad:#F08A76; --soft:#1C2925; --ana:#EC9BC0; --gold:#E3B55E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1614; --surface:#16211E; --ink:#E4EDE9; --muted:#93A59E; --line:#26342F;
  --accent:#6CC2A0; --accent-ink:#0E1614; --rain:#86B6CC;
  --hl:#5A4A12; --hl-ink:#FFEAA6; --good:#6CC28A; --bad:#F08A76; --soft:#1C2925; --ana:#EC9BC0; --gold:#E3B55E; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.ipa{font-family:var(--f-read);color:var(--rain)}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Home */
.hero{padding-block:20px 8px;display:grid;gap:10px}
.hero h1{font-size:clamp(30px,8vw,42px);font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 2px}
.meter{display:grid;gap:6px;margin-top:6px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.meter-row{display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums;gap:8px;flex-wrap:wrap}
.search{margin-top:14px;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px}
.chapters{display:grid;gap:10px;margin-top:16px}
.chapter{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.chapter .no{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
.chapter h3{font-size:17px;font-weight:700}
.chapter .sub{font-size:13px;color:var(--muted)}
.ring{width:40px;height:40px}
.results{display:grid;gap:8px;margin-top:12px}
.note{margin-top:22px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;display:grid;gap:6px}
.note a{color:var(--rain)}

/* Lesson */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 0;display:grid;gap:8px}
.top-row{display:flex;align-items:center;gap:10px}
.back{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;flex:none}
.top h2{font-size:20px;font-weight:700;min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 12px;border-radius:99px;font-size:14px;font-weight:600;color:var(--muted);border:1px solid var(--line);background:var(--surface)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{display:grid;gap:14px;margin-top:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.pill[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}

.story{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 16px}
.sent{padding-block:12px;border-bottom:1px dashed var(--line);display:grid;gap:6px}
.sent:last-child{border-bottom:0}
.en{font-family:var(--f-read);font-size:18px;line-height:1.6}
.vi{font-size:14px;color:var(--muted)}
.g{justify-self:start;font-size:12px;font-weight:600;color:var(--rain);background:var(--soft);padding:2px 8px;border-radius:6px}
.sent-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.say{font-size:13px;color:var(--muted);padding:2px 6px;border-radius:6px;border:1px solid var(--line)}
.w{font-family:inherit;font-size:inherit;background:var(--hl);color:var(--hl-ink);padding:0 3px;border-radius:3px;font-weight:700;line-height:1.3}
.w.ok{background:transparent;color:inherit;text-decoration:underline;text-decoration-color:var(--good);text-decoration-thickness:2px;text-underline-offset:3px;font-weight:700}

.list{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .wd{font-family:var(--f-read);font-weight:700;font-size:17px}
.row .meta{font-size:13px;min-width:0}
.pos{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px;font-family:var(--f-ui);vertical-align:2px}
.ic{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-size:15px}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px}
.card h3{font-size:16px}
.tense-sent{font-family:var(--f-read);font-size:20px;padding:14px;border-radius:12px;background:var(--soft);min-height:64px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-weight:600;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--rain);border-color:var(--rain);color:var(--surface)}
.pattern{font-family:var(--f-read);font-weight:700;font-size:17px}
.ex{font-family:var(--f-read);font-style:italic}
.fam-root{font-family:var(--f-display);font-size:20px;font-weight:700;color:var(--accent)}
.fam{display:grid;gap:0}
.fam-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding-block:8px;border-top:1px solid var(--line)}
.fam-row b{font-family:var(--f-read);font-size:17px}
.fam-row .meta{min-width:0;font-size:13px}

/* Flashcard */
.flash{perspective:1000px}
.fc{position:relative;min-height:260px;width:100%;border-radius:20px;background:var(--surface);border:1px solid var(--line);padding:22px;display:grid;place-items:center;text-align:center;gap:8px}
.fc .big{font-family:var(--f-read);font-size:36px;font-weight:700}
.fc .ipa{font-size:20px}
.fc .ex{font-size:16px;color:var(--muted);max-width:42ch}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:13px;border-radius:12px;font-weight:700;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.count{font-size:13px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}

/* Quiz */
.q{font-family:var(--f-read);font-size:20px}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.score{font-family:var(--f-display);font-size:44px;font-weight:800;color:var(--accent)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .35);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--line);padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:10px;max-width:640px;margin:0 auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar i{transition:none}}
.sheet .big{font-family:var(--f-read);font-size:30px;font-weight:700}
.sheet-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.player{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.pl-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pl-row .btn{padding:10px 14px}
.legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.spk{font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;border:1.5px solid currentColor;justify-self:start;color:var(--muted)}
.sp-Linh{color:var(--accent)}.sp-Ana{color:var(--ana)}.sp-Sam,.sp-Brown,.sp-Joe,.sp-man{color:var(--rain)}.sp-Ortiz,.sp-woman{color:var(--gold)}
.sipa{font-family:var(--f-read);font-size:15px;line-height:1.5;color:var(--rain);overflow-wrap:anywhere}
.sent.now{background:color-mix(in srgb,var(--hl) 35%,transparent);margin-inline:-16px;padding-inline:16px;border-radius:8px}
.spk-row{display:flex;gap:6px;flex-wrap:wrap}
.lv{display:inline-block;font-size:11px;font-weight:700;font-family:var(--f-ui);padding:0 5px;border-radius:4px;margin-left:4px;vertical-align:2px;color:var(--surface);background:var(--rain)}
.lv.A1{background:var(--good)}.lv.A2{background:var(--accent)}.lv.B1{background:var(--rain)}.lv.B2{background:var(--ink)}
.lv.x{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.btn-wide{width:100%;margin-top:12px;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:14px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.more{width:100%;margin-top:10px}
.soon{font-size:12px;color:var(--muted)}
.pr-target{font-family:var(--f-read);font-size:22px;line-height:1.6}
.pw{border-radius:4px;padding:0 2px}.pw.good{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good)}.pw.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad);text-decoration:underline wavy}
.mic{justify-self:center;width:84px;height:84px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:34px;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
.mic.on{background:var(--bad);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.pr-status{text-align:center;font-size:15px}
.pr-score{font-family:var(--f-display);font-size:30px;margin-right:6px}.pr-score.good{color:var(--good)}.pr-score.mid{color:var(--gold)}.pr-score.bad{color:var(--bad)}
.toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:14px;box-shadow:0 6px 24px rgb(0 0 0 / .25)}
.sync{font-size:14px;font-weight:600;color:var(--muted)}.sync.ok{color:var(--good)}.sync.warn{color:var(--gold)}
</style>

} was heating up.","Cô chạy vào phòng tắm và đánh răng trong khi nước tắm đang nóng lên.","Quá khứ tiếp diễn với while","ʃi ræn ˈɪntu ðə ˈbæθˌrum ənd brʌʃt hɚ tiθ waɪl ðə ˈwɔtɚ fɚ hɚ ˈʃaʊɚ wəz ˈhitɪŋ ʌp.",[{"sp":"narrator","t":"She ran into the bathroom and brushed her teeth while the water for her shower was heating up."}]],["There was no clean {towel}, so she had to use a small one.","Không còn khăn tắm sạch nên cô phải dùng một cái nhỏ.","There was + N; had to + V","ðɛr wəz noʊ klin ˈtaʊəl, soʊ ʃi hæd tə jus ə smɔl wʌn.",[{"sp":"narrator","t":"There was no clean towel, so she had to use a small one."}]],["Looking in the {mirror}, she said, \"I'm not going to be late again.\"","Nhìn vào gương, cô nói: \"Mình sẽ không trễ nữa.\"","Be going to – quyết tâm; V-ing mở đầu câu","ˈlʊkɪŋ ɪn ðə ˈmɪrɚ, ʃi sɛd, aɪm nɑt ˈɡoʊɪŋ tə bi leɪt əˈɡɛn.",[{"sp":"narrator","t":"Looking in the mirror, she said,"},{"sp":"Linh","t":"I'm not going to be late again."}]],["She {dressed|dress} {quickly} and put yesterday's {clothes} in the basket.","Cô mặc đồ nhanh và bỏ quần áo hôm qua vào giỏ.","Quá khứ đơn – chuỗi hành động","ʃi drɛst ˈkwɪkli ənd pʊt ˈjɛstɚˌdeɪz kloʊðz ɪn ðə ˈbæskət.",[{"sp":"narrator","t":"She dressed quickly and put yesterday's clothes in the basket."}]],["Her roommate Ana had already made {breakfast}: {coffee} and {toast}.","Bạn cùng phòng Ana đã làm sẵn bữa sáng: cà phê và bánh mì nướng.","Quá khứ hoàn thành","hɚ ˈruˌmeɪt ˈænə hæd ɔlˈrɛdi meɪd ˈbrɛkfəst: ˈkɑfi ənd toʊst.",[{"sp":"narrator","t":"Her roommate Ana had already made breakfast: coffee and toast."}]],["\"You look {ready},\" Ana said. \"Have you checked your {schedule}?\"","\"Trông bạn sẵn sàng rồi,\" Ana nói. \"Bạn đã xem lịch chưa?\"","Hiện tại hoàn thành – câu hỏi","ju lʊk ˈrɛdi, ˈænə sɛd. hæv ju tʃɛkt jɚ ˈskɛdʒul?",[{"sp":"Ana","t":"You look ready,"},{"sp":"narrator","t":"Ana said."},{"sp":"Ana","t":"Have you checked your schedule?"}]],["\"If I {leave} now, I will catch the bus,\" Linh answered.","\"Nếu mì ents in Đà Lạt."}]],["When she calls, her {mother} is usually cooking and her {father} is reading the news.","Khi cô gọi, mẹ thường đang nấu ăn còn bố đang đọc báo.","Hiện tại tiếp diễn","wɛn ʃi kɔlz, hɚ ˈmʌðɚ ɪz ˈjuʒuəli ˈkʊkɪŋ ənd hɚ ˈfɑðɚ ɪz ˈridɪŋ ðə nuz.",[{"sp":"narrator","t":"When she calls, her mother is usually cooking and her father is reading the news."}]],["Her younger {brother}, Minh, got {married|marry} last year.","Em trai cô, Minh, đã cưới vợ năm ngoái.","Quá khứ đơn; get married","hɚ ˈjʌŋɡɚ ˈbrʌðɚ, mɪn, ɡɑt ˈmɛrid læst jɪr.",[{"sp":"narrator","t":"Her younger brother, Minh, got married last year."}]],["His {wife} is a teacher, and they have a baby {daughter} who was {born} in March.","Vợ cậu là giáo viên, họ có một bé gái sinh hồi tháng Ba.","Bị động quá khứ: was born","hɪz waɪf ɪz ə ˈtitʃɚ, ənd ðeɪ hæv ə ˈbeɪbi ˈdɔtɚ hu wəz bɔrn ɪn mɑrtʃ.",[{"sp":"narrator","t":"His wife is a teacher, and they have a baby daughter who was born in March."}]],["Linh's older {sister} has one {son}, who is ten years old.","Chị gái Linh có một con trai 10 tuổi.","Mệnh đề quan hệ với who","lɪŋz ˈoʊldɚ ˈsɪstɚ hæz wʌn sʌn, hu ɪz tɛn jɪrz oʊld.",[{"sp":"narrator","t":"Linh's older sister has one son, who is ten years old."}]],["Her {grandmother} and {grandfather} {raised|raise} the children while the parents were working.","Ông bà nuôi các cháu trong khi bố mẹ đi làm.","Quá khứ đơn + quá khứ tiếp diễn","hɚ ˈɡrændˌmʌðɚ ənd ˈɡrændˌfɑðɚ reɪzd ðə ˈtʃɪldrən waɪl ðə ˈpɛrənts wɝ ˈwɝkɪŋ.",[{"sp":"narrator","t":"Her grandmother and grandfather raised the children while the parents were working."}]],["Linh has always been {close} to her {aunt}, who lives next door to her parents.","Linh luôn thân với dì, người sống cạnh nhà bố mẹ.","Hiện tại hoàn thành với always","lɪŋ hæz ˈɔlˌweɪz bɪn kloʊs tə hɚ ænt, hu lɪvz nɛkst dɔr tə hɚ ˈpɛrənts.",[{"sp":"narrator","t":"Linh has always been close to her aunt, who lives next door to her parents."}]],["Her {uncle} jokes that she should find a {hu :"A1","base":null},{"w":"quiet","p":"adj","vi":"yên tĩnh","ipa":"ˈkwaɪət","lv":"A1","base":null},{"w":"noisy","p":"adj","vi":"ồn ào","ipa":"ˈnɔɪzi","lv":"A2","base":null},{"w":"clean","p":"v","vi":"lau dọn","ipa":"klin","lv":"A1","base":null},{"w":"repair","p":"v","vi":"sửa chữa","ipa":"rɪˈpɛr","lv":"A2","base":null},{"w":"landlord","p":"n","vi":"chủ nhà (cho thuê)","ipa":"ˈlændˌlɔrd","lv":"","base":null},{"w":"move","p":"v","vi":"chuyển (nhà)","ipa":"muv","lv":"A1","base":null},{"w":"comfortable","p":"adj","vi":"thoải mái, dễ chịu","ipa":"ˈkʌmfɚtəbəl","lv":"A2","base":null}],"story":[["Linh and Ana {moved|move} into a new {apartment} two months ago.","Linh và Ana chuyển đến căn hộ mới hai tháng trước.","Quá khứ đơn + ago","lɪŋ ənd ˈænə muvd ˈɪntu ə nu əˈpɑrtmənt tu mʌnθs əˈɡoʊ.",[{"sp":"narrator","t":"Linh and Ana moved into a new apartment two months ago."}]],["The {rent} is higher, but the place is much more {comfortable} than their old one.","Tiền thuê cao hơn, nhưng chỗ này thoải mái hơn nhiều so với chỗ cũ.","So sánh hơn: more + adj + than","ðə rɛnt ɪz ˈhaɪɚ, bʌt ðə pleɪs ɪz mʌtʃ mɔr ˈkʌmfɚtəbəl ðən ðɛr oʊld wʌn.",[{"sp":"narrator","t":"The rent is higher, but the place is much more comfortable than their old one."}]],["The {kitchen} is small, yet the {living room} has a big {window} facing the park.","Bếp nhỏ, nhưng phòng khách có cửa sổ lớn nhìn ra công viên.","Liên từ yet; V-ing rút gọn mệnh đề","ðə ˈkɪtʃən ɪz smɔl, jɛt ðə ˈlɪvɪŋ rum hæz ə bɪɡ ˈwɪndoʊ ˈfeɪsɪŋ ðə pɑrk.",[{"sp":"narrator","t":"The kitchen is small, yet the living room has a big window facing the park."}]],["Each {bedroom} has a lock on the {door}, which Linh really likes.","Mỗi phòng ngủ có khóa ở cửa, điều Linh rất thích.","Mệnh đề quan hệ với which","itʃ ˈbɛdˌrum hæz ə lɑk ɑn ðə dɔr, wɪtʃ lɪŋ ˈrɪli laɪks.",[{"sp":"narrator","t":"Each bedroom has a lock on the door, which Linh really likes."}]],["They haven't bought much {furniture} yet, only a {sofa} and two chairs.","Họ chưa mua nhiều đồ nội thất, mới có một sô-pha và hai cái ghế.","Hiện tại hoàn thành phủ định + yet","ðeɪ ˈhævənt bɑt mʌtʃ ˈfɝnɪtʃɚ jɛt, ˈoʊnli ə ˈsoʊfə ənd tu tʃɛrz.",[{"sp":"narrator","t":"They haven't bought much furniture yet, only a sofa and two chairs."}]],["Last week, the {landlord} {repaired|repair} a crack in the {wall}.","Tuần trước chủ nhà đã sửa một vết nứt trên tường.","Quá khứ đơn","læst wik, ðə ˈlændˌlɔrd rɪˈpɛrd ə kræk ɪn ðə wɔl.",[{"sp":"narrator","t":"Last week, the landlord repaired a crack in the wall."}]],["The building is usually {quiet}, but the {neighbor} upstairs is {noisy} on weekends.","Tòa nhà thường yên tĩnh, nhưng hàng xóm tầng trên ồn vào cuối tuần.","Hiện tại đơn; tương phản với but","ðə ˈbɪldɪŋ ɪz ˈjuʒuəli ˈkwaɪət, bʌt ðə ˈneɪbɚ əpˈstɛrz ɪz ˈnɔɪzi ɑn ˈwiˌkɛndz.",[{"sp":"narrator","t":"The building is usually quiet, but the neighbor upstairs is noisy on weekends."}]],["Ana {cleans|clean} the {floor} every Saturday while Linh washes the dishes.","Ana lau sàn mỗi thứ Bảy trong khi Linh rửa bát.","Hiện tại đơn với while","ˈænə klinz ðə flɔr ˈɛvɚi ˈsætɚdi waɪl lɪŋ ˈwɑʃɪz ðə ˈdɪʃəz.",[{"sp":"narrator","t":"Ana cleans the floor every Saturday while Linh washes the dishes."}]],["Yesterday Linh lost her {key}, so she had to wait outside for an hour.","Hôm qua Linh làm mất chìa khóa nên phải đợi ngoài cửa một tiếng.","Quá khứ đơn; had to","ˈjɛstɚˌdeɪ lɪŋ lɔst hɚ ki, soʊ ʃi hæd tə weɪt ˌaʊtˈsaɪd fɚ ən ˈaʊɚ.",[{"sp":"narrator","t":"Yesterday Linh lost her key, so she had to wait outside for an hour."}]],["\"From now on, I'm going to keep a spare one,\" she decided.","\"Từ giờ mình sẽ giữ một chìa dự phòng,\" cô quyết định.","Be going to – kế hoạch","frəm naʊ ɑn, aɪm ˈɡoʊɪŋ tə kip ə spɛr wʌn, ʃi dɪˈsaɪdɪd.",[{"sp":"Linh","t":"From now on, I'm going to keep a spare one,"},{"sp":"narrator","t":"she decided."}]]],"drill":["They clean the apartment.","They are cleaning the apartment.","They cleaned the apartment.","They have cleaned the apartment.","They will clean the dient} she needed: {chicken}, {rice} noodles, green {vegetables|vegetable}, {salt} and black {pepper}.","Cô ghi lại mọi nguyên liệu cần: thịt gà, bún gạo, rau xanh, muối và tiêu đen.","Mệnh đề quan hệ rút gọn (bỏ that)","ʃi roʊt daʊn ˈɛvɚi ɪnˈɡridiənt ʃi ˈnidəd: ˈtʃɪkən, raɪs ˈnudəlz, ɡrin ˈvɛdʒtəbəlz, sɔlt ənd blæk ˈpɛpɚ.",[{"sp":"narrator","t":"She wrote down every ingredient she needed: chicken, rice noodles, green vegetables, salt and black pepper."}]],["While the water was {boiling|boil}, she {cut} the onions very thin.","Trong khi nước đang sôi, cô thái hành thật mỏng.","Quá khứ tiếp diễn + quá khứ đơn","waɪl ðə ˈwɔtɚ wəz ˈbɔɪlɪŋ, ʃi kʌt ðə ˈʌnjənz ˈvɛri θɪn.",[{"sp":"narrator","t":"While the water was boiling, she cut the onions very thin."}]],["Then she {fried|fry} some garlic in a little {oil}.","Sau đó cô phi tỏi với một chút dầu.","Quá khứ đơn; a little + N không đếm được","ðɛn ʃi fraɪd səm ˈɡɑrlɪk ɪn ə ˈlɪtəl ɔɪl.",[{"sp":"narrator","t":"Then she fried some garlic in a little oil."}]],["\"It smells {delicious}!\" Ana shouted from her room.","\"Thơm quá!\" Ana kêu lên từ phòng mình.","Động từ cảm giác + adj","ɪt smɛlz dɪˈlɪʃəs! ˈænə ˈʃaʊtɪd frəm hɚ rum.",[{"sp":"Ana","t":"It smells delicious!"},{"sp":"narrator","t":"Ana shouted from her room."}]],["Linh {tasted|taste} the broth and added some chili because Ana loves {spicy} food.","Linh nếm nước dùng và thêm ớt vì Ana thích đồ cay.","Because + mệnh đề","lɪŋ ˈteɪstɪd ðə brɔθ ənd ˈædəd səm ˈtʃɪli bɪˈkɔz ˈænə lʌvz ˈspaɪsi fud.",[{"sp":"narrator","t":"Linh tasted the broth and added some chili because Ana loves spicy food."}]],["They ate {dinner} from big {bowls|bowl} instead of {plates|plate}.","Họ ăn tối bằng tô lớn thay vì đĩa.","Instead of + N","ðeɪ eɪt ˈdɪnɚ frəm bɪɡ boʊlz ɪnˈstɛd əv pleɪts.",[{"sp":"narrator","t":"They ate dinner from big bowls instead of plates."}]],["\"This is the best soup I have ever eaten,\" Ana said.","\"Đây là món súp ngon nhất mình từng ăn,\" Ana nói.","So sánh nhất + hiện tại hoàn thành (ever)","ðɪs ɪz ðə bɛst sup aɪ hæv ˈɛvɚ ˈitən, ˈænə sɛd.",[{"sp":"Ana","t":"This is the best soup I have ever eaten,"},{"sp":"narrator","t":"Ana said."}]],["There were so many {leftovers|leftover} that they will have soup again tomorrow.","Còn thừa nhiều đến mức mai họ sẽ lại ăn súp.","So many + N + that …","ðɛr wɝ soʊ ˈmɛni ˈlɛfˌtoʊvɚz ðət ðeɪ wɪl hæv sup əˈɡɛn təˈmɑˌroʊ.",[{"sp":"narrator","t":"There were so many leftovers that they will have soup again tomorrow."}]]],"drill":["Linh cooks chicken soup.","Linh is cooking chicken soup.","Linh cooked chicken soup.","Linh has cooked chicken soup.","Linh will cook chicken soup.","Linh is going to cook chicken soup."],"structures":[["This is the + adj-est/most + N + S + have ever + V3","This is the best soup I have ever eaten.","Khen ngợi: điều tốt nhất từng trải qua."],["So many/much + N + that + mệnh đề","There were so many leftovers that …","Nhiều đến mức mà…"],["Instead of + N/V-ing","They ate from bowls instead of plates.","Thay vì…"]],"family":[{"root":"hunger","forms":[{"w":"hunger","p":"n","vi":"cơn đói","ipa":"ˈhʌŋɡɚ","lv":""},{"w":"hungry","p":"adj","vi":"đói","ipa":"ˈhʌŋɡri","lv":"A1"},{"w":"hungrily","p":"adv","vi":"một cách thèm thuồng","ipa":"ˈhʌŋɡrəli","lv":""}]},{"root":"taste","forms":[{"w":"taste","p":"v/n","vi":"nếm; vị","ipa":"teɪst","lv":"A2"},{"w":"tasty","p":"adj","vi":"ngon","ipa":"ˈteɪsti","lv":""},{"w":"tasteless","p":"adj","vi":"nhạt nhẽo","ipa":"ˈteɪstləs","lv":""}]},{"root":"spice","forms":[{"w":"spice","p":"n","vi":"gia vị","ipa":"spaɪs","lv":""},{"w":"spicy","p":"adj","vi":"cay","ipa":"ˈspaɪsi","lv":"B1"}]},{"root":"cook","forms":[{"w":"cook","p":"v/n","vi":"nấu; đầu bếp","ipa":"kʊk","lv":"A1"},{"w":"cooker","p":"n","vi":"nồi, bếp","ipa":"ˈkʊkɚ","lv":""},{"w":"cooking","p":"n","vi":"việc nấu nướng","ipa":"ˈkʊkɪŋ","lv":"A1"}]},{"root":"boil","forms":[{"w":"boil","p":"v","vi":"đun sôi","ipa":"bɔɪl","lv":"A2"},{"w":"boiling","p":"adj","vi":"đang sôi, rất nóng","ipa":"ˈbɔɪlɪŋ","lv":""},{"w":"boiler","p":"n","vi":"nồi hơi","ipa":"ˈbɔɪlɚ","lv":""}]}]},{"id":"shopping","en":"Shopping","vi":"Mua sắm","words":[{"w":"supermarket","p":"n","vi":"siêu thị","ipa":"ˈsupɚˌmɑrkɪt","lv":"A1","base":null},{"w":"store","p":"n","vi":"cửa hàng","ipa":"stɔr","lv":"A1","base":null},{"w":"price","p":"n","vi":"giá","ipa":"praɪs","lv":"A1","base":null},{"w":"cheap","p":"adj","vi":"rẻ","ipa":"tʃip","lv":"A1","base":null},{"w":"expensive","p":"adj","vi":"đắt","ipa":"ɪkˈspɛnsɪv","lv":"A1","base":null},{"w":"discount","p":"n","vi":"giảm giá","ipa":"dɪˈskaʊnt","lv":"B1","base":null},{"w":"cash","p":"n","vi":"tiền mặt","ipa":"kæʃ","lv":"A2","base":null},{"w":"card","p":"n","vi":"thẻ","ipa":"kɑrd","lv":"A1","base":null},{"w":"receipt","p":"n","vi":"hóa đơn, biên lai","ipa":"rɪˈsit","lv":"B1","base":null},{"w":"customer","p":"n","vi":"khách hàng","ipa":"ˈkʌstəmɚ","lv":"A1","base":null},{"w":"cashier","p":"n","vi":"thu ngân","ipa":"kæˈʃɪr","lv":"","base":null},{"w":"size","p":"n","vi":"kích cỡ","ipa":"saɪz","lv":"A2","base":null},{"w":"try on","p":"phr v","vi":"mặc thử","ipa":"traɪ ɑn","lv":"A1","base":"try"},{"w":"return","p":"v","vi":"trả lại (hàng)","ipa":"rɪˈtɝn","lv":"A1","base":null},{"w":"buy","p":"v","vi":"mua","ipa":"baɪ","lv":"A1","base":null},{"w":"sell","p":"v","vi":"bán","ipa":"sɛl","lv":"A1","base":null},{"w":"pay","p":"v","vi":"trả tiền","ipa":"peɪ","lv":"A1","base":null},{"w":"cost","p":"v","vi":"có giá","ipa":"kɑst","lv":"A1","base":null},{"w":"bag","p":"n","vi":"túi, bao","ipa":"bæɡ","lv":"A1","base":null},{"w":"wallet","p":"n","vi":"ví","ipa":"ˈwɔlət","lv":"","base":null}],"story":[["On Saturday morning, Linh went to the {supermarket} near her apartment.","Sáng thứ Bảy, Linh đi siêu thị gần nhà.","Quá khứ đơn","ɑn ˈsætɚdi ˈmɔrnɪŋ, lɪŋ wɛnt tə ðə ˈsupɚˌmɑrkɪt nɪr hɚ əˈpɑrtmənt.",[{"sp":"narrator","t":"On Saturday morning, Linh went to the supermarket near her apartment."}]],["\"Everything is getting more {expensive},\" she thought when she saw the {price} of eggs.","\"Cái gì cũng đắt lên,\" cô nghĩ khi thấy giá trứng.","Hiện tại tiếp diễn: get + so sánh hơn (xu hướng)","ˈɛvriˌθɪŋ ɪz ˈɡɛtɪŋ mɔr ɪkˈspɛnsɪv, ʃi θɔt wɛn ʃi sɔ ðə praɪs əv ɛɡz.",[{"sp":"Linh","t":"Everything is getting more expensive,"},{"sp":"narrator","t":"she thought when she saw the price of eggs."}]],["Luckily, there was a 20% {discount} on rice, so she {bought|buy} two {bags|bag}.","May là gạo giảm giá 20% nên cô mua hai bao.","Quá khứ đơn; so (kết quả)","ˈlʌkəli, ðɛr wəz ə 20% dɪˈskaʊnt ɑn raɪs, soʊ ʃi bɑt tu bæɡz.",[{"sp":"narrator","t":"Luckily, there was a 20% discount on rice, so she bought two bags."}]],["After that, she went to a clothing {store} to look for a winter jacket.","Sau đó cô đến cửa hàng quần áo để tìm áo khoác mùa đông.","To + V chỉ mục đích","ˈæftɚ ðət, ʃi wɛnt tə ə ˈkloʊðɪŋ stɔr tə lʊk fɚ ə ˈwɪntɚ ˈdʒækət.",[{"sp":"narrator","t":"After that, she went to a clothing store to look for a winter jacket."}]],["The store was full of {customers|customer} because of the weekend sale.","Cửa hàng đông khách vì đợt giảm giá cuối tuần.","Because of + N","ðə stɔr wəz fʊl əv ˈkʌstəmɚz bɪˈkɔz əv ðə ˈwiˌkɛnd seɪl.",[{"sp":"narrator","t":"The store was full of customers because of the weekend sale."}]],["She {tried on|try on} a blue jacket, but the {size} was too big.","Cô mặc thử một áo xanh nhưng cỡ quá to.","Too + adj","ʃi traɪd ɑn ə blu ˈdʒækət, bʌt ðə saɪz wəz tu bɪɡ.",[{"sp":"narrator","t":"She tried on a blue jacket, but the size was too big."}]],["A smaller one {cost} only forty dollars, which was quite {cheap}.","Một chiếc nhỏ hơn chỉ 40 đô, khá rẻ.","Quá khứ đơn (cost – cost – cost); which","ə ˈsmɔlɚ wʌn kɑst ˈoʊnli ˈfɔrti ˈdɑlɚz, wɪtʃ wəz kwaɪt tʃip.",[{"sp":"narrator","t":"A smaller one cost only forty dollars, which was quite cheap."}]],["At the counter, the {cashier} asked, \"Would you like to {pay} with {cash} or {card}?\"","Ở quầy, thu ngân hỏi: \"Chị muốn trả tiền mặt hay thẻ?\"","Would you like to + V – lời mời lịch sự","ət ðə ˈkaʊntɚ, ðə kæˈʃɪr æskt, wʊd ju laɪk tə peɪ wɪð kæʃ ɔr kɑrd?",[{"sp":"narrator","t":"At the counter, the cashier asked,"},{"sp":"woman","t":"Would you like to pay with cash or card?"}]],["Linh opened her {wallet} and realized she had left her card at home.","Linh mở ví và nhận ra mình để quên thẻ ở nhà.","Quá khứ hoàn thành","lɪŋ ˈoʊpənd hɚ ˈwɔlət ənd ˈriəˌlaɪzd ʃi hæd lɛft hɚ kɑrd ət hoʊm.",[{"sp":"narrator","t":"Linh opened her wallet and realized she had left her card at home."}]],["She paid in cash and kept the {receipt} in case she wanted to {return} the jacket.","Cô trả tiền mặt và giữ hóa đơn phòng khi muốn trả lại áo.","In case + mệnh đề","ʃi peɪd ɪn kæʃ ənd kɛpt ðə rɪˈsit ɪn keɪs ʃi ˈwɔntɪd tə rɪˈtɝn ðə ˈdʒækət.",[{"sp":"narrator","t":"She paid in cash and kept the receipt in case she wanted to return the jacket."}]],["The store doesn't {sell} jackets in her favorite color, but she is happy with this one.","Cửa hàng không bán áo màu cô thích, nhưng cô vẫn hài lòng với chiếc này.","Hiện tại đơn phủ định","ðə stɔr ˈdʌzənt sɛl ˈdʒækɪts ɪn hɚ ˈfeɪvɚɪt ˈkʌlɚ, bʌt ʃi ɪz ˈhæpi wɪð ðɪs wʌn.",[{"sp":"narrator","t":"The store doesn't sell jackets in her favorite color, but she is happy with this one."}]]],"drill":["She buys a winter jacket.","She is buying a winter jacket.","She bought a winter jacket.","She has bought a winter jacket.","She will buy a winter jacket.","She is going to buy a winter jacket."],"structures":[["S + get + more + adj","Everything is getting more expensive.","Diễn tả sự thay đổi dần dần."],["too + adj (+ to V)","The size was too big.","Quá… (không phù hợp)."],["… in case + mệnh đề","She kept the receipt in case she wanted to return it.","Phòng khi…"]],"family":[{"root":"expense","forms":[{"w":"expense","p":"n","vi":"chi phí","ipa":"ɪkˈspɛns","lv":"B2"},{"w":"expensive","p":"adj","vi":"đắt","ipa":"ɪkˈspɛnsɪv","lv":"A1"},{"w":"inexpensive","p":"adj","vi":"không đắt","ipa":"ˌɪnɪkˈspɛnsɪv","lv":""},{"w":"expensively","p":"adv","vi":"một cách tốn kém","ipa":"ɪkˈspɛnsɪvli","lv":""}]},{"root":"price","forms":[{"w":"price","p":"n","vi":"giá","ipa":"praɪs","lv":"A1"},{"w":"priceless","p":"adj","vi":"vô giá","ipa":"ˈpraɪsləs","lv":""},{"w":"pricey","p":"adj","vi":"đắt đỏ (thân mật)","ipa":"ˈpraɪsi","lv":""}]},{"root":"pay","forms":[{"w":"pay","p":"v","vi":"trả tiền","ipa":"peɪ","lv":"A1"},{"w":"payment","p":"n","vi":"khoản thanh toán","ipa":"ˈpeɪmənt","lv":"B1"},{"w":"payable","p":"adj","vi":"phải trả","ipa":"ˈpeɪəbəl","lv":""}]},{"root":"sell","forms":[{"w":"sell","p":"v","vi":"bán","ipa":"sɛl","lv":"A1"},{"w":"seller","p":"n","vi":"người bán","ipa":"ˈsɛlɚ","lv":""},{"w":"sale","p":"n","vi":"sự bán; đợt giảm giá","ipa":"seɪl","lv":"A2"}]},{"root":"receive","forms":[{"w":"receive","p":"v","vi":"nhận","ipa":"rəˈsiv","lv":"A2"},{"w":"receipt","p":"n","vi":"biên lai","ipa":"rɪˈsit","lv":"B1"},{"w":"receiver","p":"n","vi":"người nhận","ipa":"rəˈsivɚ","lv":""},{"w":"reception","p":"n","vi":"quầy lễ tân; sự tiếp đón","ipa":"rɪˈsɛpʃən","lv":"A2"}]}]},{"id":"transport","en":"Getting Around","vi":"Đi lại","words":[{"w":"bus","p":"n","vi":"xe buýt","ipa":"bʌs","lv":"A1","base":null},{"w":"bus stop","p":"n","vi":"trạm xe buýt","ipa":"bʌs stɑp","lv":"A1","base":"stop"},{"w":"train","p":"n","vi":"tàu hỏa","ipa":"treɪn","lv":"A1","base":null},{"w":"station","p":"n","vi":"nhà ga","ipa":"ˈsteɪʃən","lv":"A1","base":null},{"w":"ticket","p":"n","vi":"vé","ipa":"ˈtɪkət","lv":"A1","base":null},{"w":"driver","p":"n","vi":"tài xế","ipa":"ˈdraɪvɚ","lv":"A1","base":null},{"w":"passenger","p":"n","vi":"hành khách","ipa":"ˈpæsəndʒɚ","lv":"A2","base":null},{"w":"traffic","p":"n","vi":"giao thông","ipa":"ˈtræfɪk","lv":"A1","base":null},{"w":"crowded","p":"adj","vi":"đông đúc","ipa":"ˈkraʊdəd","lv":"A2","base":null},{"w":"ride","p":"v","vi":"đi (xe đạp, xe máy)","ipa":"raɪd","lv":"A1","base":null},{"w":"walk","p":"n","vi":"cuộc đi bộ, quãng đi bộ","ipa":"wɔk","lv":"A1","base":null},{"w":"cross","p":"v","vi":"băng qua","ipa":"krɔs","lv":"A2","base":null},{"w":"street","p":"n","vi":"đường phố","ipa":"strit","lv":"A1","base":null},{"w":"corner","p":"n","vi":"góc (đường)","ipa":"ˈkɔrnɚ","lv":"A2","base":null},{"w":"map","p":"n","vi":"bản đồ","ipa":"mæp","lv":"A1","base":null},{"w":"direction","p":"n","vi":"hướng; chỉ đường","ipa":"dəˈrɛkʃən","lv":"A2","base":null},{"w":"turn","p":"v","vi":"rẽ","ipa":"tɝn","lv":"A1","base":null},{"w":"miss","p":"v","vi":"lỡ (chuyến xe)","ipa":"mɪs","lv":"A1","base":null},{"w":"arrive","p":"v","vi":"đến nơi","ipa":"əˈraɪv","lv":"A1","base":null},{"w":"on time","p":"phr","vi":"đúng giờ","ipa":"ɑn taɪm","lv":"A1","base":"time"}],"story":[["Linh doesn't have a car, so she takes the {bus} to work.","Linh không có ô tô nên đi xe buýt đi làm.","Hiện tại đơn phủ định; so","lɪŋ ˈdʌzənt hæv ə kɑr, soʊ ʃi teɪks ðə bʌs tə wɝk.",[{"sp":"narrator","t":"Linh doesn't have a car, so she takes the bus to work."}]],["The {bus stop} is on the {corner} of her {street}, a five-minute {walk} from home.","Trạm xe buýt ở góc đường nhà cô, đi bộ năm phút.","Tính từ ghép: a five-minute walk","ðə bʌs stɑp ɪz ɑn ðə ˈkɔrnɚ əv hɚ strit, ə faɪv-ˈmɪnət wɔk frəm hoʊm.",[{"sp":"narrator","t":"The bus stop is on the corner of her street, a five-minute walk from home."}]],["This morning the bus was so {crowded} that she had to stand.","Sáng nay xe đông đến mức cô phải đứng.","So + adj + that","ðɪs ˈmɔrnɪŋ ðə bʌs wəz soʊ ˈkraʊdəd ðət ʃi hæd tə stænd.",[{"sp":"narrator","t":"This morning the bus was so crowded that she had to stand."}]],["The {driver} was playing jazz, and some {passengers|passenger} were sleeping.","Tài xế đang mở nhạc jazz, vài hành khách đang ngủ.","Quá khứ tiếp diễn – bối cảnh","ðə ˈdraɪvɚ wəz ˈpleɪɪŋ dʒæz, ənd səm ˈpæsəndʒɚz wɝ ˈslipɪŋ.",[{"sp":"narrator","t":"The driver was playing jazz, and some passengers were sleeping."}]],["Because of heavy {traffic}, the bus {arrived|arrive} ten minutes late.","Vì kẹt xe, xe buýt đến trễ mười phút.","Because of + N","bɪˈkɔz əv ˈhɛvi ˈtræfɪk, ðə bʌs ɚˈaɪvd tɛn ˈmɪnəts leɪt.",[{"sp":"narrator","t":"Because of heavy traffic, the bus arrived ten minutes late."}]],["Linh almost {missed|miss} her {train} at the central {station}.","Linh suýt lỡ tàu ở ga trung tâm.","Almost + quá khứ đơn","lɪŋ ˈɔlˌmoʊst mɪst hɚ treɪn ət ðə ˈsɛntrəl ˈsteɪʃən.",[{"sp":"narrator","t":"Linh almost missed her train at the central station."}]],["She showed her {ticket} and jumped on just before the doors closed.","Cô đưa vé và nhảy lên ngay trước khi cửa đóng.","Before + mệnh đề","ʃi ʃoʊd hɚ ˈtɪkət ənd dʒʌmpt ɑn dʒʌst bɪˈfɔr ðə dɔrz kloʊzd.",[{"sp":"narrator","t":"She showed her ticket and jumped on just before the doors closed."}]],["On the train, a tourist asked her for {directions|direction} to the museum.","Trên tàu, một du khách hỏi đường cô đến bảo tàng.","Ask sb for sth","ɑn ðə treɪn, ə ˈtʊrəst æskt hɚ fɚ dɚˈɛkʃənz tə ðə mjuˈziəm.",[{"sp":"narrator","t":"On the train, a tourist asked her for directions to the museum."}]],["Linh opened the {map} on her phone and said, \"Get off at the next stop, {cross} the bridge and {turn} right.\"","Linh mở bản đồ trên điện thoại và nói: \"Xuống ở trạm sau, qua cầu rồi rẽ phải.\"","Câu mệnh lệnh","lɪŋ ˈoʊpənd ðə mæp ɑn hɚ foʊn ənd sɛd, ɡɛt ɔf ət ðə nɛkst stɑp, krɔs ðə brɪdʒ ənd tɝn raɪt.",[{"sp":"narrator","t":"Linh opened the map on her phone and said,"},{"sp":"Linh","t":"Get off at the next stop, cross the bridge and turn right."}]],["\"If you hurry, you'll get there {on time},\" she added.","\"Nếu anh nhanh chân thì sẽ đến kịp giờ,\" cô nói thêm.","Câu điều kiện loại 1","ɪf ju ˈhɝi, jul ɡɛt ðɛr ɑn taɪm, ʃi ˈædəd.",[{"sp":"Linh","t":"If you hurry, you'll get there on time,"},{"sp":"narrator","t":"she added."}]],["Tomorrow she is going to {ride} her bike, because it will be sunny.","Ngày mai cô định đạp xe vì trời sẽ nắng.","Be going to (dự định) + will (dự đoán)","təˈmɑˌroʊ ʃi ɪz ˈɡoʊɪŋ tə raɪd hɚ baɪk, bɪˈkɔz ɪt wɪl bi ˈsʌni.",[{"sp":"narrator","t":"Tomorrow she is going to ride her bike, because it will be sunny."}]]],"drill":["Linh takes the train.","Linh is taking the train.","Linh took the train.","Linh has taken the train.","Linh will take the train.","Linh is going to take the train."],"structures":[["S + be + so + adj + that + mệnh đề","The bus was so crowded that she had to stand.","Quá… đến nỗi…"],["a + số-danh từ (số ít) + N","a five-minute walk","Tính từ ghép: danh từ trong đó không thêm s."],["V nguyên mẫu …, V …","Get off at the next stop and turn right.","Câu mệnh lệnh/chỉ đường."]],"family":[{"root":"drive","forms":[{"w":"drive","p":"v","vi":"lái xe","ipa":"draɪv","lv":"A1"},{"w":"driver","p":"n","vi":"tài xế","ipa":"ˈdraɪvɚ","lv":"A1"},{"w":"driving","p":"n","vi":"việc lái xe","ipa":"ˈdraɪvɪŋ","lv":"A2"}]},{"root":"pass","forms":[{"w":"pass","p":"v","vi":"đi qua; vượt qua","ipa":"pæs","lv":"A2"},{"w":"passenger","p":"n","vi":"hành khách","ipa":"ˈpæsəndʒɚ","lv":"A2"},{"w":"passage","p":"n","vi":"lối đi; đoạn văn","ipa":"ˈpæsədʒ","lv":"B2"}]},{"root":"direct","forms":[{"w":"direct","p":"adj/v","vi":"trực tiếp; chỉ đạo","ipa":"dəˈrɛkt","lv":"A2"},{"w":"direction","p":"n","vi":"hướng","ipa":"dəˈrɛkʃən","lv":"A2"},{"w":"directly","p":"adv","vi":"một cách trực tiếp","ipa":"dəˈrɛktli","lv":"B1"},{"w":"director","p":"n","vi":"giám đốc; đạo diễn","ipa":"dəˈrɛktɚ","lv":"A2"}]},{"root":"arrive","forms":[{"w":"arrive","p":"v","vi":"đến nơi","ipa":"əˈraɪv","lv":"A1"},{"w":"arrival","p":"n","vi":"sự đến","ipa":"əˈraɪvəl","lv":"B1"}]},{"root":"crowd","forms":[{"w":"crowd","p":"n","vi":"đám đông","ipa":"kraʊd","lv":"A2"},{"w":"crowded","p":"adj","vi":"đông đúc","ipa":"ˈkraʊdəd","lv":"A2"}]}]},{"id":"work","en":"At the Office","vi":"Công sở","words":[{"w":"office","p":"n","vi":"văn phòng","ipa":"ˈɔfɪs","lv":"A1","base":null},{"w":"coworker","p":"n","vi":"đồng nghiệp","ipa":"ˈkoʊˌwɝkɚ","lv":"","base":null},{"w":"manager","p":"n","vi":"quản lý","ipa":"ˈmænədʒɚ","lv":"A2","base":null},{"w":"meeting","p":"n","vi":"cuộc họp","ipa":"ˈmitɪŋ","lv":"A1","base":null},{"w p with a terrible {headache}.","Thứ Tư tuần trước, Linh thức dậy với cơn đau đầu khủng khiếp.","Quá khứ đơn","læst ˈwɛnzdi, lɪŋ woʊk ʌp wɪð ə ˈtɛrəbəl ˈhɛdˌeɪk.",[{"sp":"narrator","t":"Last Wednesday, Linh woke up with a terrible headache."}]],["Her {throat} {hurt} and she had a slight {fever}.","Cổ họng đau và cô hơi sốt.","Quá khứ đơn (hurt – hurt – hurt)","hɚ θroʊt hɝt ənd ʃi hæd ə slaɪt ˈfivɚ.",[{"sp":"narrator","t":"Her throat hurt and she had a slight fever."}]],["She thought she had caught a {cold} on the rainy bus ride.","Cô nghĩ mình đã bị cảm trên chuyến xe buýt mưa.","Quá khứ hoàn thành","ʃi θɔt ʃi hæd kɑt ə koʊld ɑn ðə ˈreɪni bʌs raɪd.",[{"sp":"narrator","t":"She thought she had caught a cold on the rainy bus ride."}]],["She called the clinic and made an {appointment} for ten o'clock.","Cô gọi phòng khám và đặt hẹn lúc 10 giờ.","Make an appointment","ʃi kɔld ðə ˈklɪnɪk ənd meɪd ən əˈpɔɪntmənt fɚ tɛn əˈklɑk.",[{"sp":"narrator","t":"She called the clinic and made an appointment for ten o'clock."}]],["A {nurse} took her temperature and asked about her {symptoms|symptom}.","Y tá đo nhiệt độ và hỏi về triệu chứng.","Ask about + N","ə nɝs tʊk hɚ ˈtɛmprətʃɚ ənd æskt əˈbaʊt hɚ ˈsɪmptəmz.",[{"sp":"narrator","t":"A nurse took her temperature and asked about her symptoms."}]],["\"How long have you been feeling like this?\" the {doctor} asked.","\"Cô thấy thế này bao lâu rồi?\" bác sĩ hỏi.","Hiện tại hoàn thành tiếp diễn","haʊ lɔŋ hæv ju bɪn ˈfilɪŋ laɪk ðɪs? ðə ˈdɑktɚ æskt.",[{"sp":"man","t":"How long have you been feeling like this?"},{"sp":"narrator","t":"the doctor asked."}]],["\"Since Monday. My {head} and {stomach} feel strange too.\"","\"Từ thứ Hai ạ. Đầu và bụng tôi cũng thấy lạ.\"","Since + mốc thời gian","sɪns ˈmʌndi. maɪ hɛd ənd ˈstʌmək fil streɪndʒ tu.",[{"sp":"Linh","t":"Since Monday. My head and stomach feel strange too."}]],["He said the {pain} wasn't serious and gave her some {medicine}.","Ông nói cơn đau không nghiêm trọng và cho cô ít thuốc.","Câu t "vi":"dự báo","ipa":"ˈfɔrˌkæst","lv":"","base":null},{"w":"warm","p":"adj","vi":"ấm","ipa":"wɔrm","lv":"A1","base":null},{"w":"cool","p":"adj","vi":"mát","ipa":"kul","lv":"A1","base":null},{"w":"freezing","p":"adj","vi":"lạnh cóng","ipa":"ˈfrizɪŋ","lv":"B1","base":"freeze"},{"w":"umbrella","p":"n","vi":"ô, dù","ipa":"əmˈbrɛlə","lv":"A1","base":null},{"w":"wet","p":"adj","vi":"ướt","ipa":"wɛt","lv":"A2","base":null}],"story":[["Seattle is famous for its {rain}, and Linh is slowly learning to love it.","Seattle nổi tiếng vì mưa, và Linh đang dần học cách yêu nó.","Hiện tại tiếp diễn – quá trình","siˈætəl ɪz ˈfeɪməs fɚ ɪts reɪn, ənd lɪŋ ɪz ˈsloʊli ˈlɝnɪŋ tə lʌv ɪt.",[{"sp":"narrator","t":"Seattle is famous for its rain, and Linh is slowly learning to love it."}]],["In the {fall}, the leaves turn red and the {temperature} drops quickly.","Mùa thu lá chuyển đỏ và nhiệt độ giảm nhanh.","Hiện tại đơn – sự thật","ɪn ðə fɔl, ðə livz tɝn rɛd ənd ðə ˈtɛmprətʃɚ drɑps ˈkwɪkli.",[{"sp":"narrator","t":"In the fall, the leaves turn red and the temperature drops quickly."}]],["This morning the {forecast} said it would be {cloudy} with strong {wind}.","Sáng nay dự báo nói trời sẽ nhiều mây và gió mạnh.","Tường thuật: will → would","ðɪs ˈmɔrnɪŋ ðə ˈfɔrˌkæst sɛd ɪt wʊd bi ˈklaʊdi wɪð strɔŋ wɪnd.",[{"sp":"narrator","t":"This morning the forecast said it would be cloudy with strong wind."}]],["Linh took her {umbrella}, but a gust turned it inside out and she got completely {wet}.","Linh mang ô nhưng một cơn gió lật ngược nó và cô ướt sũng.","Get + adj (trở nên)","lɪŋ tʊk hɚ əmˈbrɛlə, bʌt ə ɡʌst tɝnd ɪt ɪnˈsaɪd aʊt ənd ʃi ɡɑt kəmˈplitli wɛt.",[{"sp":"narrator","t":"Linh took her umbrella, but a gust turned it inside out and she got completely wet."}]],["\"In Đà Lạt, the {weather} is {cool} all year,\" she told Ana.","\"Ở Đà Lạt, thời tiết mát quanh năm,\" cô nói với Ana.","Hiện tại đơn – sự thật","ɪn dà lạt, ðə ˈwɛðɚ ɪz kul ɔl jɪr, ʃi toʊld ˈænə.",[{"sp":"Linh","t":"In Đà Lạt, the weather is cool all year,"},{"sp":"narrator","t":"she told Ana."}]],["\"Here every {season} is different. {Summer|summer} is {warm} and {sunny}, but {winter} can be {freezing}.\"","\"Ở đây mùa nào cũng khác. Mùa hè ấm và nắng, còn mùa đông có thể lạnh cóng.\"","Can + V – khả năng có thể xảy ra","hir ˈɛvɚi ˈsizən ɪz ˈdɪfɚənt. ˈsʌmɚ ɪz wɔrm ənd ˈsʌni, bʌt ˈwɪntɚ kən bi ˈfrizɪŋ.",[{"sp":"Linh","t":"Here every season is different. Summer is warm and sunny, but winter can be freezing."}]],["\"Have you ever seen {snow}?\" Ana asked. \"Not yet, but I hope it snows this December.\"","\"Bạn từng thấy tuyết chưa?\" \"Chưa, mong là tháng 12 này có tuyết.\"","Hiện tại hoàn thành với ever / not yet","hæv ju ˈɛvɚ sin snoʊ? ˈænə æskt. nɑt jɛt, bʌt aɪ hoʊp ɪt snoʊz ðɪs dɪˈsɛmbɚ.",[{"sp":"Ana","t":"Have you ever seen snow?"},{"sp":"narrator","t":"Ana asked."},{"sp":"Linh","t":"Not yet, but I hope it snows this December."}]],["Last night a {storm} knocked down a tree on their street.","Đêm qua một cơn bão quật đổ cây trên đường nhà họ.","Quá khứ đơn","læst naɪt ə stɔrm nɑkt daʊn ə tri ɑn ðɛr strit.",[{"sp":"narrator","t":"Last night a storm knocked down a tree on their street."}]],["By the time Linh woke up, the city workers had already removed it.","Lúc Linh thức dậy, công nhân thành phố đã dọn nó đi rồi.","By the time + quá khứ đơn, quá khứ hoàn thành","baɪ ðə taɪm lɪŋ woʊk ʌp, ðə ˈsɪti ˈwɝkɚz hæd ɔlˈrɛdi riˈmuvd ɪt.",[{"sp":"narrator","t":"By the time Linh woke up, the city workers had already removed it."}]],["It was only five {degrees|degree} outside, so she wore two sweaters.","Ngoài trời chỉ 5 độ nên cô mặc hai áo len.","Quá khứ đơn","ɪt wəz ˈoʊnli faɪv dɪˈɡriz ˌaʊtˈsaɪd, soʊ ʃi wɔr tu ˈswɛtɚz.",[{"sp":"narrator","t":"It was only five degrees outside, so she wore two sweaters."}]],["Linh can't wait for {spring}, when the cherry trees bloom.","Linh nóng lòng chờ mùa xuân, khi hoa anh đào nở.","Can't wait for + N; when (mệnh đề quan hệ chỉ thời gian)","lɪŋ kænt weɪt fɚ sprɪŋ, wɛn ðə ˈt d|miss} her family and felt a little {lonely}.","Cô nhớ gia đình và thấy hơi cô đơn.","Quá khứ đơn","ʃi mɪst hɚ ˈfæməli ənd fɛlt ə ˈlɪtəl ˈloʊnli.",[{"sp":"narrator","t":"She missed her family and felt a little lonely."}]],["Ana said, \"Don't be {afraid}. Just stay {calm} and speak slowly.\"","Ana nói: \"Đừng sợ. Cứ bình tĩnh và nói chậm thôi.\"","Mệnh lệnh phủ định: Don't + V","ˈænə sɛd, doʊnt bi əˈfreɪd. dʒʌst steɪ kɑm ənd spik ˈsloʊli.",[{"sp":"narrator","t":"Ana said,"},{"sp":"Ana","t":"Don't be afraid. Just stay calm and speak slowly."}]],["In the morning, Linh was {tired} but also {excited}.","Sáng hôm đó Linh mệt nhưng cũng hào hứng.","Tính từ -ed: cảm xúc của người","ɪn ðə ˈmɔrnɪŋ, lɪŋ wəz ˈtaɪɚd bʌt ˈɔlsoʊ ɪkˈsaɪtəd.",[{"sp":"narrator","t":"In the morning, Linh was tired but also excited."}]],["During the talk, she forgot one word and felt {embarrassed}, but nobody seemed {upset}.","Lúc thuyết trình cô quên một từ và thấy ngượng, nhưng chẳng ai có vẻ khó chịu.","Seem + adj; during + N","ˈdʊrɪŋ ðə tɔk, ʃi fɚˈɡɑt wʌn wɝd ənd fɛlt ɪmˈbɛrəst, bʌt ˈnoʊˌbɑˌdi simd əpˈsɛt.",[{"sp":"narrator","t":"During the talk, she forgot one word and felt embarrassed, but nobody seemed upset."}]],["Even Sam, who is usually {bored} in meetings, listened carefully.","Ngay cả Sam, người hay chán trong các cuộc họp, cũng chăm chú nghe.","Mệnh đề quan hệ who","ˈivɪn sæm, hu ɪz ˈjuʒuəli bɔrd ɪn ˈmitɪŋz, ˈlɪsənd ˈkɛrfəli.",[{"sp":"narrator","t":"Even Sam, who is usually bored in meetings, listened carefully."}]],["When she finished, everyone clapped, and she was really {surprised}.","Khi cô kết thúc, mọi người vỗ tay và cô thực sự ngạc nhiên.","When + quá khứ đơn","wɛn ʃi ˈfɪnɪʃt, ˈɛvriˌwʌn klæpt, ənd ʃi wəz ˈrɪli sɚˈpraɪzd.",[{"sp":"narrator","t":"When she finished, everyone clapped, and she was really surprised."}]],["Mr. Brown said, \"I'm {proud} of you. You were very {confident}.\"","Ông Brown nói: \"Tôi tự hào về cô. Cô rất tự tin.\"","Be proud of + sb","ˈmɪstɚ. braʊn sɛd, aɪm praʊd əv ju. ju wɝ ˈvɛri ˈkɑnfədənt.",[{"sp":"narrator","t":"Mr. Brown said,"},{"sp":"Brown","t":"I'm proud of you. You were very confident."}]],["Linh felt {happy} and {relaxed} for the rest of the day.","Linh thấy vui và thư thái suốt phần còn lại của ngày.","For the rest of + N","lɪŋ fɛlt ˈhæpi ənd rɪˈlækst fɚ ðə rɛst əv ðə deɪ.",[{"sp":"narrator","t":"Linh felt happy and relaxed for the rest of the day."}]],["She was {grateful} to Ana, and she realized that being {sad} or {angry} at herself had never helped.","Cô biết ơn Ana và nhận ra việc buồn hay giận bản thân chưa bao giờ có ích.","V-ing làm chủ ngữ; be grateful to sb","ʃi wəz ˈɡreɪtfəl tə ˈænə, ənd ʃi ˈriəˌlaɪzd ðət ˈbiɪŋ sæd ɔr ˈæŋɡri ət hɚˈsɛlf hæd ˈnɛvɚ hɛlpt.",[{"sp":"narrator","t":"She was grateful to Ana, and she realized that being sad or angry at herself had never helped."}]]],"drill":["Linh feels confident.","Linh is feeling confident.","Linh felt confident.","Linh has felt confident.","Linh will feel confident.","Linh is going to feel confident."],"structures":[["-ed (người cảm thấy) / -ing (vật gây ra)","Sam is bored. The meeting is boring.","Phân biệt tính từ đuôi -ed và -ing."],["Don't + V","Don't be afraid.","Mệnh lệnh phủ định, khuyên nhủ."],["V-ing + V (chủ ngữ)","Being angry at herself never helped.","Danh động từ làm chủ ngữ, động từ chia số ít."]],"family":[{"root":"happy","forms":[{"w":"happy","p":"adj","vi":"vui","ipa":"ˈhæpi","lv":"A1"},{"w":"happiness","p":"n","vi":"niềm hạnh phúc","ipa":"ˈhæpinəs","lv":"B1"},{"w":"unhappy","p":"adj","vi":"không vui","ipa":"ʌnˈhæpi","lv":"A2"},{"w":"happily","p":"adv","vi":"một cách vui vẻ","ipa":"ˈhæpəli","lv":"A2"}]},{"root":"nerve","forms":[{"w":"nerve","p":"n","vi":"dây thần kinh; can đảm","ipa":"nɝv","lv":"B2"},{"w":"nervous","p":"adj","vi":"hồi hộp","ipa":"ˈnɝvəs","lv":"A2"},{"w":"nervously","p":"adv","vi":"một cách bồn chồn","ipa":"ˈnɝvəsli","lv":""}]},{"root":"excite","forms":[{"w":"excite","p":"v","vi":"làm hào hứng","ipa":"ɪkˈsaɪt","lv":""},{"  tháng Ba ở Seattle lạnh và xám xịt nên cô hay ở trong nhà.","Hiện tại đơn – sự thật","ˈfɛbjəˌwɛri ənd mɑrtʃ ɚ koʊld ənd ɡreɪ ɪn siˈætəl, soʊ ʃi steɪz ɪnˈsaɪd ə lɑt.",[{"sp":"narrator","t":"February and March are cold and gray in Seattle, so she stays inside a lot."}]],["In {April} and {May}, the park is full of flowers, and {June}, {July} and {August} are the best {months|month} for camping.","Tháng Tư, tháng Năm công viên đầy hoa; tháng Sáu, Bảy, Tám là những tháng đẹp nhất để cắm trại.","So sánh nhất: the best","ɪn ˈeɪprəl ənd meɪ, ðə pɑrk ɪz fʊl əv ˈflaʊɚz, ənd dʒun, dʒuˈlaɪ ənd ˈɑɡəst ɚ ðə bɛst mʌnθs fɚ ˈkæmpɪŋ.",[{"sp":"narrator","t":"In April and May, the park is full of flowers, and June, July and August are the best months for camping."}]],["Her {birthday} is in {September}, and Ana has already planned a party.","Sinh nhật cô vào tháng Chín và Ana đã lên kế hoạch tiệc rồi.","Hiện tại hoàn thành + already","hɚ ˈbɝθˌdeɪ ɪz ɪn sɛpˈtɛmbɚ, ənd ˈænə hæz ɔlˈrɛdi plænd ə ˈpɑrti.",[{"sp":"narrator","t":"Her birthday is in September, and Ana has already planned a party."}]],["{October} is busy at work, and in {November} and {December} she prepares the year-end report.","Tháng Mười bận rộn, còn tháng Mười Một, Mười Hai cô chuẩn bị báo cáo cuối năm.","Hiện tại đơn","ɑkˈtoʊbɚ ɪz ˈbɪzi ət wɝk, ənd ɪn noʊˈvɛmbɚ ənd dɪˈsɛmbɚ ʃi priˈpɛrz ðə jɪr-ɛnd riˈpɔrt.",[{"sp":"narrator","t":"October is busy at work, and in November and December she prepares the year-end report."}]],["{Today|today} is a special {date}: she circled it in red last week.","Hôm nay là một ngày đặc biệt: tuần trước cô đã khoanh đỏ nó.","Hiện tại đơn ↔ quá khứ đơn","təˈdeɪ ɪz ə ˈspɛʃəl deɪt: ʃi ˈsɝkəld ɪt ɪn rɛd læst wik.",[{"sp":"narrator","t":"Today is a special date: she circled it in red last week."}]],["{Yesterday|yesterday} she worked late, and {tomorrow} she has a meeting at nine {o'clock|o’clock} in the {morning}.","Hôm qua cô làm muộn, mai cô có cuộc họp lúc 9 giờ sáng.","at + giờ; in the morning","ˈjɛstɚˌdeɪ ʃi wɝkt leɪt, ənd təˈmɑˌroʊ ʃi hæz ə ˈmitɪŋ ət naɪn əˈklɑk ɪn ðə ˈmɔrnɪŋ.",[{"sp":"narrator","t":"Yesterday she worked late, and tomorrow she has a meeting at nine o'clock in the morning."}]],["This {afternoon} she has a free {hour}, so she will finish her homework.","Chiều nay cô rảnh một tiếng nên sẽ làm xong bài tập.","Tương lai đơn","ðɪs ˌæftɚˈnun ʃi hæz ə fri ˈaʊɚ, soʊ ʃi wɪl ˈfɪnɪʃ hɚ ˈhoʊmˌwɝk.",[{"sp":"narrator","t":"This afternoon she has a free hour, so she will finish her homework."}]],["{Tonight|tonight} she is going to bed before {midnight}.","Tối nay cô sẽ đi ngủ trước nửa đêm.","Hiện tại tiếp diễn – kế hoạch tối nay","təˈnaɪt ʃi ɪz ˈɡoʊɪŋ tə bɛd bɪˈfɔr ˈmɪdˌnaɪt.",[{"sp":"narrator","t":"Tonight she is going to bed before midnight."}]],["\"Wait a {moment},\" Ana said. \"Your class starts in fifteen {minutes|minute}, not at a {quarter} past seven!\"","\"Khoan đã,\" Ana nói. \"Lớp của bạn bắt đầu sau 15 phút nữa, không phải lúc 7 giờ 15!\"","in + khoảng thời gian; a quarter past","weɪt ə ˈmoʊmənt, ˈænə sɛd. jɚ klæs stɑrts ɪn fɪfˈtin ˈmɪnəts, nɑt ət ə ˈkwɔrtɚ pæst ˈsɛvən!",[{"sp":"Ana","t":"Wait a moment,"},{"sp":"narrator","t":"Ana said."},{"sp":"Ana","t":"Your class starts in fifteen minutes, not at a quarter past seven!"}]],["Linh laughed. Even with a planner, she still forgets things at {night}.","Linh bật cười. Dù có sổ kế hoạch, ban đêm cô vẫn hay quên.","Even with + N; at night","lɪŋ læft. ˈivɪn wɪð ə ˈplænɚ, ʃi stɪl fɚˈɡɛts θɪŋz ət naɪt.",[{"sp":"narrator","t":"Linh laughed. Even with a planner, she still forgets things at night."}]]],"drill":["Linh writes in her planner.","Linh is writing in her planner.","Linh wrote in her planner.","Linh has written in her planner.","Linh will write in her planner.","Linh is going to write in her planner."],"structures":[["at + giờ · on + thứ/ngày · in + tháng/năm/buổi","at nine o'clock · on Monday · in May · in the morning","Giới từ chỉ thời gian. Riêng: at night."],["a quarter past/to · half past + giờ","a quarter past seven = 7:15 · half past seven = 7:30","Cách nói giờ kiểu Mỹ, ngoài cách đọc số (seven fifteen)."],["S + V + in + khoảng thời gian","Your class starts in fifteen minutes.","in = sau bao lâu nữa (tương lai)."]],"family":[{"root":"day","forms":[{"w":"day","p":"n","vi":"ngày","ipa":"deɪ","lv":"A1"},{"w":"daily","p":"adj/adv","vi":"hằng ngày","ipa":"ˈdeɪli","lv":"A2"},{"w":"today","p":"adv/n","vi":"hôm nay","ipa":"təˈdeɪ","lv":"A1"}]},{"root":"week","forms":[{"w":"week","p":"n","vi":"tuần","ipa":"wik","lv":"A1"},{"w":"weekly","p":"adj/adv","vi":"hằng tuần","ipa":"ˈwikli","lv":""},{"w":"weekend","p":"n","vi":"cuối tuần","ipa":"ˈwiˌkɛnd","lv":"A1"}]},{"root":"month","forms":[{"w":"month","p":"n","vi":"tháng","ipa":"mʌnθ","lv":"A1"},{"w":"monthly","p":"adj/adv","vi":"hằng tháng","ipa":"ˈmʌnθli","lv":""}]},{"root":"year","forms":[{"w":"year","p":"n","vi":"năm","ipa":"jɪr","lv":"A1"},{"w":"yearly","p":"adj/adv","vi":"hằng năm","ipa":"ˈjɪrli","lv":""}]},{"root":"night","forms":[{"w":"night","p":"n","vi":"đêm","ipa":"naɪt","lv":"A1"},{"w":"nightly","p":"adj/adv","vi":"hằng đêm","ipa":"ˈnaɪtli","lv":""},{"w":"tonight","p":"adv/n","vi":"tối nay","ipa":"təˈnaɪt","lv":"A1"},{"w":"midnight","p":"n","vi":"nửa đêm","ipa":"ˈmɪdˌnaɪt","lv":"A1"}]}]},{"id":"numbers","en":"Numbers","vi":"Con số","words":[{"w":"first","p":"number","vi":"thứ nhất","ipa":"fɝst","lv":"A1","base":null},{"w":"one","p":"number","vi":"một","ipa":"wʌn","lv":"A1","base":null},{"w":"two","p":"number","vi":"hai","ipa":"tu","lv":"A1","base":null},{"w":"three","p":"number","vi":"ba","ipa":"θri","lv":"A1","base":null},{"w":"four","p":"number","vi":"bốn","ipa":"fɔr","lv":"A1","base":null},{"w":"five","p":"number","vi":"năm","ipa":"faɪv","lv":"A1","base":null},{"w":"six","p":"number","vi":"sáu","ipa":"sɪks","lv":"A1","base":null},{"w":"second","p":"number","vi":"thứ hai","ipa":"ˈsɛkənd","lv":"A1","base":null},{"w":"seven","p":"number","vi":"bảy","ipa":"ˈsɛvən","lv":"A1","base":null},{"w":"eight","p" "lv":"A1","base":null},{"w":"beautiful","p":"adj","vi":"đẹp","ipa":"ˈbjutəfəl","lv":"A1","base":null},{"w":"strong","p":"adj","vi":"mạnh mẽ","ipa":"strɔŋ","lv":"A1","base":null},{"w":"nose","p":"n","vi":"mũi","ipa":"noʊz","lv":"A1","base":null},{"w":"ear","p":"n","vi":"tai","ipa":"ir","lv":"A1","base":null},{"w":"leg","p":"n","vi":"chân (cả cẳng)","ipa":"lɛɡ","lv":"A1","base":null},{"w":"foot","p":"n","vi":"bàn chân","ipa":"fʊt","lv":"A1","base":null},{"w":"body","p":"n","vi":"cơ thể","ipa":"ˈbɑdi","lv":"A1","base":null},{"w":"pretty","p":"adj","vi":"xinh xắn","ipa":"ˈprɪti","lv":"A1","base":null},{"w":"adult","p":"n","vi":"người lớn","ipa":"əˈdʌlt","lv":"A1","base":null},{"w":"person","p":"n","vi":"người (số ít)","ipa":"ˈpɝsən","lv":"A1","base":null}],"story":[["One Sunday in the park, Linh saw a little {girl} crying near the lake.","Một Chủ nhật ở công viên, Linh thấy một bé gái đang khóc gần hồ.","see + sb + V-ing","wʌn ˈsʌnˌdeɪ ɪn ðə pɑrk, lɪŋ sɔ ə ˈlɪtəl ɡɝl ˈkraɪɪŋ nɪr ðə leɪk.",[{"sp":"narrator","t":"One Sunday in the park, Linh saw a little girl crying near the lake."}]],["She was about five, with {blond} {hair} and big blue {eyes|eye}.","Bé khoảng năm tuổi, tóc vàng, mắt xanh to.","with + N (miêu tả ngoại hình)","ʃi wəz əˈbaʊt faɪv, wɪð blɑnd hɛr ənd bɪɡ blu aɪz.",[{"sp":"narrator","t":"She was about five, with blond hair and big blue eyes."}]],["Her {face} was red and her {hands|hand} were cold.","Mặt bé đỏ và tay lạnh ngắt.","Quá khứ đơn với be","hɚ feɪs wəz rɛd ənd hɚ hændz wɝ koʊld.",[{"sp":"narrator","t":"Her face was red and her hands were cold."}]],["\"Are you lost?\" Linh asked. The {child} nodded but didn't open her {mouth}.","\"Con bị lạc à?\" Linh hỏi. Bé gật đầu nhưng không mở miệng.","Quá khứ đơn phủ định","ɚ ju lɔst? lɪŋ æskt. ðə tʃaɪld ˈnɑdəd bʌt ˈdɪdənt ˈoʊpən hɚ maʊθ.",[{"sp":"Linh","t":"Are you lost?"},{"sp":"narrator","t":"Linh asked. The child nodded but didn't open her mouth."}]],["Linh gently took her {arm} and walked to the information desk.","Linh nhẹ nhàng nắm tay bé và đi tới quầy thông tin.","Trạng từ cách thức: gently","lɪŋ ˈdʒɛntli tʊk hɚ ɑrm ənd wɔkt tə ðə ˌɪnfɚˈmeɪʃən dɛsk.",[{"sp":"narrator","t":"Linh gently took her arm and walked to the information desk."}]],["Many {people} were there: an {old} {man}, a {woman} with a {baby}, and two {teenagers|teenager} on bikes.","Có nhiều người ở đó: một ông lão, một người phụ nữ bế em bé và hai thiếu niên đi xe đạp.","people là số nhiều của person","ˈmɛni ˈpipəl wɝ ðɛr: ən oʊld mæn, ə ˈwʊmən wɪð ə ˈbeɪbi, ənd tu ˈtiˌneɪdʒɚz ɑn baɪks.",[{"sp":"narrator","t":"Many people were there: an old man, a woman with a baby, and two teenagers on bikes."}]],["The girl said her mom was {tall}, with {short} black hair, and her brother was a {young} {boy} in a red cap.","Bé nói mẹ bé cao, tóc đen ngắn, còn anh trai là một cậu bé đội mũ đỏ.","Câu tường thuật","ðə ɡɝl sɛd hɚ mɑm wəz tɔl, wɪð ʃɔrt blæk hɛr, ənd hɚ ˈbrʌðɚ wəz ə jʌŋ bɔɪ ɪn ə rɛd kæp.",[{"sp":"narrator","t":"The girl said her mom was tall, with short black hair, and her brother was a young boy in a red cap."}]],["Ten minutes later, a {beautiful} woman ran toward them.","Mười phút sau, một người phụ nữ xinh đẹp chạy về phía họ.","Quá khứ đơn (run – ran)","tɛn ˈmɪnəts ˈleɪtɚ, ə ˈbjutəfəl ˈwʊmən ræn təˈwɔrd ðəm.",[{"sp":"narrator","t":"Ten minutes later, a beautiful woman ran toward them."}]],["\"Thank you! She's {strong}, but she gets scared easily,\" the mother said.","\"Cảm ơn cô! Con bé mạnh mẽ nhưng dễ sợ lắm,\" người mẹ nói.","get + adj","θæŋk ju! ʃiz strɔŋ, bʌt ʃi ɡɛts skɛrd ˈizəli, ðə ˈmʌðɚ sɛd.",[{"sp":"woman","t":"Thank you! She's strong, but she gets scared easily,"},{"sp":"narrator","t":"the mother said."}]],["The girl wiped her {nose}, smiled, and whispered something in her mom's {ear}.","Bé lau mũi, mỉm cười và thì thầm gì đó vào tai mẹ.","Chuỗi hành động quá khứ","ðə ɡɝl waɪpt hɚ noʊz, smaɪld, ənd ˈwɪspɚd ˈsʌmθɪŋ ɪn hɚ mɑmz ir.",[{"sp":"narrator","t":"The girl wiped her nose, smiled, and whispered something in her mom's ear."}]],["Linh's {legs|leg} were tired and her left {foot} hurt, but her whole {body} felt light.","Chân Linh mỏi và bàn chân trái đau, nhưng cả người cô thấy nhẹ nhõm.","feel + adj","lɪŋz lɛɡz wɝ ˈtaɪɚd ənd hɚ lɛft fʊt hɝt, bʌt hɚ hoʊl ˈbɑdi fɛlt laɪt.",[{"sp":"narrator","t":"Linh's legs were tired and her left foot hurt, but her whole body felt light."}]],["\"What a {pretty} smile,\" she thought. Many {adults|adult} forget how scary it is to be small.","\"Nụ cười xinh quá,\" cô nghĩ. Nhiều người lớn quên rằng bé nhỏ thì đáng sợ thế nào.","What a + adj + N!","wʌt ə ˈprɪti smaɪl, ʃi θɔt. ˈmɛni əˈdʌlts fɚˈɡɛt haʊ ˈskɛri ɪt ɪz tə bi smɔl.",[{"sp":"Linh","t":"What a pretty smile,"},{"sp":"narrator","t":"she thought. Many adults forget how scary it is to be small."}]],["That day, Linh felt like a good {person}.","Hôm đó, Linh thấy mình là người tốt.","feel like + N","ðət deɪ, lɪŋ fɛlt laɪk ə ɡʊd ˈpɝsən.",[{"sp":"narrator","t":"That day, Linh felt like a good person."}]]],"drill":["The girl looks for her mother.","The girl is looking for her mother.","The girl looked for her mother.","The girl has looked for her mother.","The girl will look for her mother.","The girl is going to look for her mother."],"structures":[["S + have/has + adj + N · S + be + adj","She has blond hair. Her mom is tall.","Miêu tả ngoại hình."],["What a + adj + N (số ít)!","What a pretty smile!","Câu cảm thán."],["Danh từ số nhiều bất quy tắc","person → people · child → children · man → men · woman → women · foot → feet","Không thêm s."]],"family":[{"root":"child","forms":[{"w":"child","p":"n","vi":"đứa trẻ","ipa":"tʃaɪld","lv":"A1"},{"w":"children","p":"n","vi":"trẻ em (số nhiều)","ipa":"ˈtʃɪldrən","lv":""},{"w":"childhood","p":"n","vi":"tuổi thơ","ipa":"ˈtʃaɪldˌhʊd","lv":"B1"},{"w":"childish","p":"adj","vi":"trẻ con","ipa":"ˈtʃaɪldɪʃ","lv":""}]},{"root":"young","forms":[{"w":"young","p":"adj","vi":"trẻ","ipa":"jʌŋ","lv":"A1"},{"w":"youth","p":"n","vi":"tuổi trẻ","ipa":"juθ","lv":"B1"},{"w":"younger","p":"adj","vi":"trẻ hơn, (em) út","ipa":"ˈjʌŋɡɚ","lv":""}]},{"root":"strong","forms":[{"w":"strong","p":"adj","vi":"mạnh","ipa":"strɔŋ","lv":"A1"},{"w":"strength","p":"n","vi":"sức mạnh","ipa":"strɛŋkθ","lv":"B1"},{"w":"strongly","p":"adv","vi":"mạnh mẽ","ipa":"ˈstrɔŋli","lv":"B1"}]},{"root":"beauty","forms":[{"w":"beauty","p":"n","vi":"vẻ đẹp","ipa":"ˈbjuti","lv":"B1"},{"w":"beautiful","p":"adj","vi":"đẹp","ipa":"ˈbjutəfəl","lv":"A1"},{"w":"beautifully","p":"adv","vi":"đẹp đẽ","ipa":"ˈbjutəfli","lv":""}]}]},{"id":"restaurant","en":"At the Restaurant","vi":"Ở nhà hàng","words":[{"w":"lunch","p":"n","vi":"bữa trưa","ipa":"lʌntʃ","lv":"A1","base":null},{"w":"restaurant","p":"n","vi":"nhà hàng","ipa":"ˈrɛstɚˌɑnt","lv":"A1","base":null},{"w":"waiter","p":"n","vi":"bồi bàn","ipa":"ˈweɪtɚ","lv":"A1","base":null},{"w":"menu","p":"n","vi":"thực đơn","ipa":"ˈmɛnju","lv":"A1","base":null},{"w":"bread","p":"n","vi":"bánh mì","ipa":"brɛd","lv":"A1","base":null},{"w":"butter","p":"n","vi":"bơ","ipa":"ˈbʌtɚ","lv":"A1","base":null},{"w":"thirsty","p":"adj","vi":"khát","ipa":"ˈθɝsti","lv":"A1","base":null},{"w":"glass","p":"n","vi":"ly, cốc thủy tinh","ipa":"ɡlæs","lv":"A1","base":null},{"w":"beer","p":"n","vi":"bia","ipa":"bɪr","lv":"A1","base":null},{"w":"wine","p":"n","vi":"rượu vang","ipa":"waɪn","lv":"A1","base":null},{"w":"order","p":"v","vi":"gọi món, đặt","ipa":"ˈɔrdɚ","lv":"A1","base":null},{"w":"fish","p":"n","vi":"cá","ipa":"fɪʃ","lv":"A1","base":null},{"w":"potato","p":"n","vi":"khoai tây","ipa":"pəˈteɪˌtoʊ","lv":"A1","base":null},{"w":"carrot","p":"n","vi":"cà rốt","ipa":"ˈkærət","lv":"A1","base":null},{"w":"sandwich","p":"n","vi":"bánh mì kẹp","ipa":"ˈsændwɪtʃ","lv":"A1","base":null},{"w":"cheese","p":"n","vi":"phô mai","ipa":"tʃiz","lv":"A1","base":null},{"w":"tomato","p":"n","vi":"cà chua","ipa":"təˈmeɪˌtoʊ","lv":"A1","base":null},{"w":"onion","p":"n","vi":"hành tây","ipa":"ˈʌnjən","lv":"A1","base":null},{"w":"eat","p":"v","vi":"ăn  {potatoes|potato} and {carrots|carrot} on the side.","\"Cho tôi món cá,\" Linh nói, và gọi thêm khoai tây, cà rốt nướng ăn kèm.","I'd like + N (lịch sự)","aɪd laɪk ðə fɪʃ, pliz, lɪŋ sɛd, ənd ʃi ˈɔrdɚd ˈroʊstəd pəˈteɪtoʊz ənd ˈkærəts ɑn ðə saɪd.",[{"sp":"Linh","t":"I'd like the fish, please,"},{"sp":"narrator","t":"Linh said, and she ordered roasted potatoes and carrots on the side."}]],["Sam chose a big {sandwich} with {cheese}, {tomato} and {onion}.","Sam chọn một bánh mì kẹp to có phô mai, cà chua và hành tây.","with + N","sæm tʃoʊz ə bɪɡ ˈsændwɪtʃ wɪð tʃiz, təˈmeɪˌtoʊ ənd ˈʌnjən.",[{"sp":"narrator","t":"Sam chose a big sandwich with cheese, tomato and onion."}]],["Mr. Brown, who doesn't {eat} {meat}, had a {salad} with a boiled {egg}.","Ông Brown, người không ăn thịt, gọi xa lát với trứng luộc.","Mệnh đề quan hệ who","ˈmɪstɚ. braʊn, hu ˈdʌzənt it mit, hæd ə ˈsæləd wɪð ə bɔɪld ɛɡ.",[{"sp":"narrator","t":"Mr. Brown, who doesn't eat meat, had a salad with a boiled egg."}]],["Each {meal} came with a free {drink}.","Mỗi suất ăn kèm một đồ uống miễn phí.","Each + N số ít + V số ít","itʃ mil keɪm wɪð ə fri drɪŋk.",[{"sp":"narrator","t":"Each meal came with a free drink."}]],["The {food} was so good that they forgot about work for an hour.","Đồ ăn ngon đến mức họ quên công việc cả tiếng.","so + adj + that","ðə fud wəz soʊ ɡʊd ðət ðeɪ fɚˈɡɑt əˈbaʊt wɝk fɚ ən ˈaʊɚ.",[{"sp":"narrator","t":"The food was so good that they forgot about work for an hour."}]],["\"Which {dish} was your favorite?\" the waiter asked. \"All of them!\" they answered.","\"Món nào ngon nhất ạ?\" bồi bàn hỏi. \"Món nào cũng ngon!\" họ đáp.","Câu hỏi với Which + N","wɪtʃ dɪʃ wəz jɚ ˈfeɪvɚɪt? ðə ˈweɪtɚ æskt. ɔl əv ðəm! ðeɪ ˈænsɚd.",[{"sp":"man","t":"Which dish was your favorite?"},{"sp":"narrator","t":"the waiter asked."},{"sp":"Sam","t":"All of them!"},{"sp":"narrator","t":"they answered."}]]],"drill":["They eat lunch together.","They are eating lunch together.","They ate lunch together.","They have eat , ənd pleɪn ˈtɪkəts ɚ ɪkˈspɛnsɪv, lɪŋ sɛz.",[{"sp":"Linh","t":"The flight is six hours, and plane tickets are expensive,"},{"sp":"narrator","t":"Linh says."}]],["Instead, she decides to {travel} {south} to California by {car}.","Thay vào đó, cô quyết định lái xe xuống phía nam tới California.","by + phương tiện (không có mạo từ)","ɪnˈstɛd, ʃi dɪˈsaɪdz tə ˈtrævəl saʊθ tə ˌkæləˈfɔrnjə baɪ kɑr.",[{"sp":"narrator","t":"Instead, she decides to travel south to California by car."}]],["Her {trip} will start in the {north}, cross the {mountains|mountain} and end near Los Angeles.","Chuyến đi sẽ bắt đầu ở phía bắc, vượt núi và kết thúc gần Los Angeles.","Tương lai đơn – chuỗi hành động","hɚ trɪp wɪl stɑrt ɪn ðə nɔrθ, krɔs ðə ˈmaʊntənz ənd ɛnd nɪr loʊs ˈændʒəlɪs.",[{"sp":"narrator","t":"Her trip will start in the north, cross the mountains and end near Los Angeles."}]],["She'll {visit} a famous {river} valley and take a {boat} tour.","Cô sẽ thăm một thung lũng sông nổi tiếng và đi thuyền tham quan.","Tương lai đơn","ʃil ˈvɪzɪt ə ˈfeɪməs ˈrɪvɚ ˈvæli ənd teɪk ə boʊt tʊr.",[{"sp":"narrator","t":"She'll visit a famous river valley and take a boat tour."}]],["Her cousin, who lives on the {east} coast, wants to {fly} in and meet her in the {west}.","Người anh họ sống ở bờ đông muốn bay sang gặp cô ở miền tây.","Mệnh đề quan hệ who","hɚ ˈkʌzən, hu lɪvz ɑn ðə ist koʊst, wɑnts tə flaɪ ɪn ənd mit hɚ ɪn ðə wɛst.",[{"sp":"narrator","t":"Her cousin, who lives on the east coast, wants to fly in and meet her in the west."}]],["Linh has booked a cheap {hotel} that is popular with {tourists|tourist}.","Linh đã đặt một khách sạn rẻ được khách du lịch ưa chuộng.","popular with + N","lɪŋ hæz bʊkt ə tʃip hoʊˈtɛl ðət ɪz ˈpɑpjəlɚ wɪð ˈtʊrəsts.",[{"sp":"narrator","t":"Linh has booked a cheap hotel that is popular with tourists."}]],["She doesn't need her {passport}, but she'll bring it anyway.","Cô không cần hộ chiếu, nhưng vẫn sẽ mang theo.","anyway (dù sao)","ʃi ˈdʌzənt nid hɚ ˈpæˌspɔrt, bʌt ʃil brɪŋ ɪt ˈɛniˌweɪ.",[{"sp":"narrator","t":"She doesn't need her passport, but she'll bring it anyway."}]],["Her cousin will take a {taxi} from the {airport} to the hotel.","Anh họ sẽ đi taxi từ sân bay đến khách sạn.","from … to …","hɚ ˈkʌzən wɪl teɪk ə ˈtæksi frəm ðə ˈɛrˌpɔrt tə ðə hoʊˈtɛl.",[{"sp":"narrator","t":"Her cousin will take a taxi from the airport to the hotel."}]],["\"This {country} is so big,\" Linh thinks. \"One day I want to see the {world}, not as a {visitor}, but like a local.\"","\"Đất nước này rộng quá,\" Linh nghĩ. \"Một ngày mình muốn ngắm thế giới, không phải như khách, mà như người bản địa.\"","not as …, but like …","ðɪs ˈkʌntri ɪz soʊ bɪɡ, lɪŋ θɪŋks. wʌn deɪ aɪ wɑnt tə si ðə wɝld, nɑt əz ə ˈvɪzɪtɚ, bʌt laɪk ə ˈloʊkəl.",[{"sp":"Linh","t":"This country is so big,"},{"sp":"narrator","t":"Linh thinks."},{"sp":"Linh","t":"One day I want to see the world, not as a visitor, but like a local."}]]],"drill":["Linh travels to California.","Linh is traveling to California.","Linh traveled to California.","Linh has traveled to California.","Linh will travel to California.","Linh is going to travel to California."],"structures":[["by + car/plane/bus/train · on foot","She travels by car.","Phương tiện đi lại, không dùng a/the."],["S + has/have never + V3","She has never seen the ocean from a beach.","Chưa từng làm gì."],["(be) far from + nơi chốn","It is very far from Seattle.","Cách xa."]],"family":[{"root":"travel","forms":[{"w":"travel","p":"v/n","vi":"đi lại; du lịch","ipa":"ˈtrævəl","lv":"A1"},{"w":"traveler","p":"n","vi":"lữ khách","ipa":"ˈtrævəlɚ","lv":"A2"},{"w":"traveling","p":"n","vi":"việc đi du lịch","ipa":"ˈtrævəlɪŋ","lv":""}]},{"root":"visit","forms":[{"w":"visit","p":"v/n","vi":"thăm; chuyến thăm","ipa":"ˈvɪzɪt","lv":"A1"},{"w":"visitor","p":"n","vi":"khách thăm","ipa":"ˈvɪzɪtɚ","lv":"A1"}]},{"root":"fly","forms":[{"w":"fly","p":"v","vi":"bay","ipa":"flaɪ","lv":"A1"},{"w":"flew","p":"v","vi":"(quá khứ của fly)","ipa":"flu","lv":""},{"w":"flown nh stopped at a small {farm} owned by an old {farmer} named Joe.","Trên đường đi, Linh ghé một trang trại nhỏ của ông nông dân già tên Joe.","Rút gọn bị động: owned by, named","ɑn hɚ trɪp, lɪŋ stɑpt ət ə smɔl fɑrm oʊnd baɪ ən oʊld ˈfɑrmɚ neɪmd dʒoʊ.",[{"sp":"narrator","t":"On her trip, Linh stopped at a small farm owned by an old farmer named Joe."}]],["He has a lot of {land} and many {animals|animal}.","Ông có nhiều đất và nhiều động vật.","a lot of / many","hi hæz ə lɑt əv lænd ənd ˈmɛni ˈænəməlz.",[{"sp":"narrator","t":"He has a lot of land and many animals."}]],["There were {cows|cow} in the field, {pigs|pig} in the mud and white {sheep} on the hill.","Bò ở ngoài đồng, lợn dưới bùn và cừu trắng trên đồi.","sheep: số nhiều giữ nguyên","ðɛr wɝ kaʊz ɪn ðə fild, pɪɡz ɪn ðə mʌd ənd waɪt ʃip ɑn ðə hɪl.",[{"sp":"narrator","t":"There were cows in the field, pigs in the mud and white sheep on the hill."}]],["A brown {horse} came to the fence, and Linh fed it an apple.","Một con ngựa nâu đến bên hàng rào và Linh cho nó ăn táo.","feed – fed – fed","ə braʊn hɔrs keɪm tə ðə fɛns, ənd lɪŋ fɛd ɪt ən ˈæpəl.",[{"sp":"narrator","t":"A brown horse came to the fence, and Linh fed it an apple."}]],["Joe's {dog} followed them everywhere, but his {cat} stayed lazily on the porch.","Chó của Joe theo họ khắp nơi, còn con mèo thì nằm lười trên hiên.","Tương phản với but","dʒoʊz dɔɡ ˈfɑloʊd ðəm ˈɛvriˌwɛr, bʌt hɪz kæt steɪd ˈlæzəli ɑn ðə pɔrtʃ.",[{"sp":"narrator","t":"Joe's dog followed them everywhere, but his cat stayed lazily on the porch."}]],["\"Be careful,\" Joe said. \"Sometimes there's a {snake} in the tall grass, and the barn is full of {mice|mouse}.\"","\"Cẩn thận nhé,\" Joe nói. \"Đôi khi có rắn trong cỏ cao, còn kho thóc thì đầy chuột.\"","Be careful; mouse → mice","bi ˈkɛrfəl, dʒoʊ sɛd. səmˈtaɪmz ðɛrz ə sneɪk ɪn ðə tɔl ɡræs, ənd ðə bɑrn ɪz fʊl əv maɪs.",[{"sp":"Joe","t":"Be careful,"},{"sp":"narrator","t":"Joe said."},{"sp":"Joe","t":"Sometimes there's a snake in the tall grass, and the barn is full of mice."}]],["Linh heard {birds|bird} singing in an old apple {tree}.","Linh nghe tiếng chim hót trên một cây táo già.","hear + sb/sth + V-ing","lɪŋ hɝd bɝdz ˈsɪŋɪŋ ɪn ən oʊld ˈæpəl tri.",[{"sp":"narrator","t":"Linh heard birds singing in an old apple tree."}]],["Joe's wife {grows|grow} vegetables and beautiful {flowers|flower}, and she sells every {plant} at the market.","Vợ Joe trồng rau và hoa đẹp, và bán từng cây ở chợ.","Hiện tại đơn","dʒoʊz waɪf ɡroʊz ˈvɛdʒtəbəlz ənd ˈbjutəfəl ˈflaʊɚz, ənd ʃi sɛlz ˈɛvɚi plænt ət ðə ˈmɑrkət.",[{"sp":"narrator","t":"Joe's wife grows vegetables and beautiful flowers, and she sells every plant at the market."}]],["The {air} was fresh and clean, completely different from the city.","Không khí trong lành, khác hẳn thành phố.","different from","ðə ɛr wəz frɛʃ ənd klin, kəmˈplitli ˈdɪfɚənt frəm ðə ˈsɪti.",[{"sp":"narrator","t":"The air was fresh and clean, completely different from the city."}]],["Before leaving, Linh promised her niece a trip to the zoo to see a {lion} and an {elephant}.","Trước khi đi, Linh hứa đưa cháu gái đi sở thú xem sư tử và voi.","before + V-ing; an + nguyên âm","bɪˈfɔr ˈlivɪŋ, lɪŋ ˈprɑməst hɚ nis ə trɪp tə ðə zu tə si ə ˈlaɪən ənd ən ˈɛləfənt.",[{"sp":"narrator","t":"Before leaving, Linh promised her niece a trip to the zoo to see a lion and an elephant."}]]],"drill":["The farmer feeds the animals.","The farmer is feeding the animals.","The farmer fed the animals.","The farmer has fed the animals.","The farmer will feed the animals.","The farmer is going to feed the animals."],"structures":[["hear/see + O + V-ing","She heard birds singing.","Nghe/thấy ai đang làm gì."],["N + V3 (by …)","a farm owned by an old farmer","Rút gọn mệnh đề bị động."],["Danh từ số nhiều đặc biệt","sheep → sheep · mouse → mice · fish → fish","Cần học thuộc."]],"family":[{"root":"farm","forms":[{"w":"farm","p":"n/v","vi":"trang trại; làm nông","ipa":"fɑrm","lv":"A1"},{"w":"farmer","p":"n","vi":"nông dân","ipa" heater} that shows old movies.","Gần trung tâm có một bảo tàng nghệ thuật và một rạp chiếu phim cũ.","that (mệnh đề quan hệ)","nɪr ðə ˈsɪti ˈsɛntɚ, ðɛr ɪz ən ɑrt mjuˈziəm ənd ə ˈθiətɚ ðət ʃoʊz oʊld ˈmuviz.",[{"sp":"narrator","t":"Near the city center, there is an art museum and a theater that shows old movies."}]],["The {hospital} where she went last month is ten minutes away.","Bệnh viện cô đến tháng trước cách đây mười phút.","where (mệnh đề quan hệ nơi chốn)","ðə ˈhɑˌspɪtəl wɛr ʃi wɛnt læst mʌnθ ɪz tɛn ˈmɪnəts əˈweɪ.",[{"sp":"narrator","t":"The hospital where she went last month is ten minutes away."}]],["One night, a {policeman} knocked on her door to ask about a stolen bike in the {area}.","Một tối, một anh cảnh sát gõ cửa hỏi về chiếc xe đạp bị mất trộm trong khu vực.","stolen (V3 dùng như tính từ)","wʌn naɪt, ə pəˈlismən nɑkt ɑn hɚ dɔr tə æsk əˈbaʊt ə ˈstoʊlən baɪk ɪn ðə ˈɛriə.",[{"sp":"narrator","t":"One night, a policeman knocked on her door to ask about a stolen bike in the area."}]],["\"The {police} are checking every building,\" he said.","\"Cảnh sát đang kiểm tra từng tòa nhà,\" anh nói.","the police + động từ số nhiều","ðə pəˈlis ɚ ˈtʃɛkɪŋ ˈɛvɚi ˈbɪldɪŋ, hi sɛd.",[{"sp":"man","t":"The police are checking every building,"},{"sp":"narrator","t":"he said."}]],["Luckily, her {upstairs} neighbor had seen the thief.","May là hàng xóm tầng trên đã thấy tên trộm.","Quá khứ hoàn thành","ˈlʌkəli, hɚ əpˈstɛrz ˈneɪbɚ hæd sin ðə θif.",[{"sp":"narrator","t":"Luckily, her upstairs neighbor had seen the thief."}]],["Linh prefers {local} shops to big stores, and now Seattle really feels like {home}.","Linh thích tiệm địa phương hơn cửa hàng lớn, và giờ Seattle thật sự như nhà.","prefer A to B; feel like + N","lɪŋ prəˈfɝz ˈloʊkəl ʃɑps tə bɪɡ stɔrz, ənd naʊ siˈætəl ˈrɪli filz laɪk hoʊm.",[{"sp":"narrator","t":"Linh prefers local shops to big stores, and now Seattle really feels like home."}]]],"drill":["Linh walks around her neighborhood.","Linh is walking around her nei
