<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Học từ vựng"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><title>Linh's Seattle Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Charis+SIL:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: một cột kiểu sổ tay — mỗi chủ đề là một chương trong năm đầu của Linh ở Seattle; từ mới tô dạ quang như bút highlight */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --ink:#14221D; --muted:#5A6A64; --line:#D3DCD8;
  --accent:#1D5A46; --accent-ink:#FFFFFF; --rain:#3E6F86;
  --hl:#FFE27A; --hl-ink:#14221D; --good:#2C7A4D; --bad:#B23F2C; --soft:#E2EAE6; --ana:#A3416D; --gold:#8A5B00;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-read:"Charis SIL", "Noto Serif", Georgia, serif;
  --f-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1614; --surface:#16211E; --ink:#E4EDE9; --muted:#93A59E; --line:#26342F;
  --accent:#6CC2A0; --accent-ink:#0E1614; --rain:#86B6CC;
  --hl:#5A4A12; --hl-ink:#FFEAA6; --good:#6CC28A; --bad:#F08A76; --soft:#1C2925; --ana:#EC9BC0; --gold:#E3B55E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1614; --surface:#16211E; --ink:#E4EDE9; --muted:#93A59E; --line:#26342F;
  --accent:#6CC2A0; --accent-ink:#0E1614; --rain:#86B6CC;
  --hl:#5A4A12; --hl-ink:#FFEAA6; --good:#6CC28A; --bad:#F08A76; --soft:#1C2925; --ana:#EC9BC0; --gold:#E3B55E; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.ipa{font-family:var(--f-read);color:var(--rain)}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Home */
.hero{padding-block:20px 8px;display:grid;gap:10px}
.hero h1{font-size:clamp(30px,8vw,42px);font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 2px}
.meter{display:grid;gap:6px;margin-top:6px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.meter-row{display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums;gap:8px;flex-wrap:wrap}
.search{margin-top:14px;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px}
.chapters{display:grid;gap:10px;margin-top:16px}
.chapter{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.chapter .no{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
.chapter h3{font-size:17px;font-weight:700}
.chapter .sub{font-size:13px;color:var(--muted)}
.ring{width:40px;height:40px}
.results{display:grid;gap:8px;margin-top:12px}
.note{margin-top:22px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;display:grid;gap:6px}
.note a{color:var(--rain)}

/* Lesson */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 0;display:grid;gap:8px}
.top-row{display:flex;align-items:center;gap:10px}
.back{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;flex:none}
.top h2{font-size:20px;font-weight:700;min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 12px;border-radius:99px;font-size:14px;font-weight:600;color:var(--muted);border:1px solid var(--line);background:var(--surface)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{display:grid;gap:14px;margin-top:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.pill[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}

.story{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 16px}
.sent{padding-block:12px;border-bottom:1px dashed var(--line);display:grid;gap:6px}
.sent:last-child{border-bottom:0}
.en{font-family:var(--f-read);font-size:18px;line-height:1.6}
.vi{font-size:14px;color:var(--muted)}
.g{justify-self:start;font-size:12px;font-weight:600;color:var(--rain);background:var(--soft);padding:2px 8px;border-radius:6px}
.sent-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.say{font-size:13px;color:var(--muted);padding:2px 6px;border-radius:6px;border:1px solid var(--line)}
.w{font-family:inherit;font-size:inherit;background:var(--hl);color:var(--hl-ink);padding:0 3px;border-radius:3px;font-weight:700;line-height:1.3}
.w.ok{background:transparent;color:inherit;text-decoration:underline;text-decoration-color:var(--good);text-decoration-thickness:2px;text-underline-offset:3px;font-weight:700}

.list{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr);grid-auto-flow:column;grid-auto-columns:auto;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .wd{font-family:var(--f-read);font-weight:700;font-size:17px}
.row .meta{font-size:13px;min-width:0}
.pos{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px;font-family:var(--f-ui);vertical-align:2px}
.ic{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-size:15px}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px}
.card h3{font-size:16px}
.tense-sent{font-family:var(--f-read);font-size:19px;line-height:1.4;padding:4px 0}
.chips.tchips{display:flex;flex-wrap:nowrap!important;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}.tchips .chip{flex:0 0 auto}
.tense-head{margin:4px 0 10px}
.tform{border-radius:12px;background:var(--soft);padding:10px 12px;margin-top:8px;border-left:4px solid #3a8f5c}
.tform.tf1{border-left-color:#c2453b}.tform.tf2{border-left-color:#3b6fc2}
.tf-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.tsg{font-weight:700;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;background:#3a8f5c}
.tf1 .tsg{background:#c2453b}.tf2 .tsg{background:#3b6fc2}
.tlb{font-weight:600}.tfm{font-size:12px;opacity:.8;white-space:normal}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-weight:600;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--rain);border-color:var(--rain);color:var(--surface)}
.pattern{font-family:var(--f-read);font-weight:700;font-size:17px}
.ex{font-family:var(--f-read);font-style:italic}
.fam-root{font-family:var(--f-display);font-size:20px;font-weight:700;color:var(--accent)}
.fam{display:grid;gap:0}
.fam-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding-block:8px;border-top:1px solid var(--line)}
.fam-row b{font-family:var(--f-read);font-size:17px}
.fam-row .meta{min-width:0;font-size:13px}

/* Flashcard */
.flash{perspective:1000px}
.fc{position:relative;min-height:260px;width:100%;border-radius:20px;background:var(--surface);border:1px solid var(--line);padding:22px;display:grid;place-items:center;text-align:center;gap:8px}
.fc .big{font-family:var(--f-read);font-size:36px;font-weight:700}
.fc .ipa{font-size:20px}
.fc .ex{font-size:16px;color:var(--muted);max-width:42ch}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:13px;border-radius:12px;font-weight:700;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.count{font-size:13px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}

/* Quiz */
.q{font-family:var(--f-read);font-size:20px}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.score{font-family:var(--f-display);font-size:44px;font-weight:800;color:var(--accent)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .35);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--line);padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:10px;max-width:640px;margin:0 auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar i{transition:none}}
.sheet .big{font-family:var(--f-read);font-size:30px;font-weight:700}
.sheet-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.player{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.pl-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pl-row .btn{padding:10px 14px}
.legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.spk{font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;border:1.5px solid currentColor;justify-self:start;color:var(--muted)}
.sp-Linh{color:var(--accent)}.sp-Ana{color:var(--ana)}.sp-Sam,.sp-Brown,.sp-Joe,.sp-man{color:var(--rain)}.sp-Ortiz,.sp-woman{color:var(--gold)}
.sipa{font-family:var(--f-read);font-size:15px;line-height:1.5;color:var(--rain);overflow-wrap:anywhere}
.sent.now{background:color-mix(in srgb,var(--hl) 35%,transparent);margin-inline:-16px;padding-inline:16px;border-radius:8px}
.spk-row{display:flex;gap:6px;flex-wrap:wrap}
.lv{display:inline-block;font-size:11px;font-weight:700;font-family:var(--f-ui);padding:0 5px;border-radius:4px;margin-left:4px;vertical-align:2px;color:var(--surface);background:var(--rain)}
.lv.A1{background:var(--good)}.lv.A2{background:var(--accent)}.lv.B1{background:var(--rain)}.lv.B2{background:var(--ink)}
.lv.x{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.btn-wide{width:100%;margin-top:12px;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:14px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.more{width:100%;margin-top:10px}
.soon{font-size:12px;color:var(--muted)}
.pr-target{font-family:var(--f-read);font-size:22px;line-height:1.6}
.pw{border-radius:4px;padding:0 2px}.pw.good{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good)}.pw.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad);text-decoration:underline wavy}
.mic{justify-self:center;width:84px;height:84px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:34px;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
.mic.on{background:var(--bad);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.pr-status{text-align:center;font-size:15px}
.pt-card{display:grid;gap:8px;text-align:center;padding:14px;border-radius:14px;background:var(--soft)}
.pt-word{font-family:var(--f-read);font-size:34px;font-weight:700}
.pchip{font-size:12px;font-weight:700;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.pchip.good{color:var(--good);border-color:var(--good)}.pchip.mid{color:var(--gold);border-color:var(--gold)}.pchip.bad{color:var(--bad);border-color:var(--bad)}
.say.pin[aria-pressed="true"]{color:var(--gold);border-color:var(--gold);font-weight:700}
.sh.now{outline:2px solid var(--hl);outline-offset:2px}
.sh-res:empty{display:none}
.today{margin-top:14px;padding:16px;border-radius:18px;background:var(--surface);border:1.5px solid var(--accent);display:grid;gap:12px}
.td-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.td-title{font-size:20px;font-weight:800;margin-top:2px}
.flame{flex:none;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;align-content:center;background:var(--soft);color:var(--muted);text-align:center;line-height:1}
.flame b{font-family:var(--f-display);font-size:24px}.flame span{font-size:10px;margin-top:2px}
.flame.on{background:color-mix(in srgb,var(--gold) 22%,var(--surface));color:var(--gold)}
.slots{display:grid;gap:8px}
.slot{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.slot-t{font-family:var(--f-display);font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.slot-n{font-weight:600;min-width:0}.slot-m{font-size:12px;color:var(--muted)}
.slot.done{background:color-mix(in srgb,var(--good) 12%,var(--surface));border-color:var(--good)}.slot.done .slot-m{color:var(--good);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.stats b{display:block;font-family:var(--f-display);font-size:24px;color:var(--accent);font-variant-numeric:tabular-nums}.stats span{font-size:11px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.cd{aspect-ratio:1;max-width:100%;border-radius:8px;display:grid;place-items:center;align-content:center;font-size:13px;background:var(--soft);position:relative;line-height:1}
.cd b{font-weight:600}.cd i{font-style:normal;font-size:10px}
.cd.sun b{color:var(--bad)}
.cd.l1{background:color-mix(in srgb,var(--good) 25%,var(--surface))}.cd.l2{background:color-mix(in srgb,var(--good) 50%,var(--surface))}.cd.l3{background:var(--good);color:var(--surface)}.cd.l3 b{color:var(--surface)}
.cd.cd-now{outline:2px solid var(--accent);outline-offset:1px}
.cd.mile{box-shadow:inset 0 0 0 2px var(--rain)}
.cd.key{display:inline-block;width:14px;height:14px;aspect-ratio:auto;vertical-align:-2px;margin:0 2px 0 8px}
.badges{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.bdg{display:grid;justify-items:center;align-content:start;gap:4px;padding:8px 2px;border-radius:12px;border:1px dashed var(--line);text-align:center;opacity:.45;filter:grayscale(1)}
.bdg span{font-size:22px}.bdg small{font-size:10.5px;line-height:1.2}
.bdg.ok{opacity:1;filter:none;border-style:solid;border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--surface))}
.chat{display:grid;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.msg .bub{padding:10px 12px;border-radius:16px;min-width:0;max-width:85%;display:grid;gap:4px;justify-items:start}
.msg .bub .en{font-size:17px;line-height:1.45}
.msg.linh .bub{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.me{justify-content:flex-end}
.msg.me .bub{background:color-mix(in srgb,var(--accent) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-bottom-right-radius:4px;font-family:var(--f-read);font-size:17px}
.msg .sc{font-family:var(--f-ui);font-size:12px;font-weight:700}.msg .sc.good{color:var(--good)}.msg .sc.bad{color:var(--bad)}
.msg.hint{justify-content:center;font-size:13px;color:var(--muted);text-align:center}
.msg.end{display:grid;justify-items:center;text-align:center;gap:6px;padding:14px;border-radius:14px;background:var(--soft)}
.ava{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:800}
.hintrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.pr-score{font-family:var(--f-display);font-size:30px;margin-right:6px}.pr-score.good{color:var(--good)}.pr-score.mid{color:var(--gold)}.pr-score.bad{color:var(--bad)}
.toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:14px;box-shadow:0 6px 24px rgb(0 0 0 / .25)}
.sync{font-size:14px;font-weight:600;color:var(--muted)}.sync.ok{color:var(--good)}.sync.warn{color:var(--gold)}
</style>

ient in your favorite soup?": [35.14, 37.96], "Great, I'm going to try it this weekend!": [38.36, 40.73], "It has chicken and vegetables.": [41.13, 42.96], "It has rice noodles and onions.": [43.36, 45.28]}}, "shopping": {"file": "c05-shopping.mp3", "w": {"Where do you usually go shopping?": [0.2, 1.95], "Oh, I like that place too.": [2.35, 4.16], "I usually go to the supermarket.": [4.56, 6.55], "I usually shop at the market near my house.": [6.95, 9.38], "Do you pay with cash or card?": [9.78, 11.53], "Good idea. I forgot my card last time!": [11.93, 14.68], "I usually pay with cash.": [15.08, 16.68], "I usually pay by card.": [17.08, 18.72], "What did you buy last week?": [19.12, 20.72], "Nice! Was it expensive?": [21.12, 22.87], "I bought a new shirt.": [23.27, 24.64], "I bought some rice and eggs.": [25.04, 26.74], "Was it cheap or expensive?": [27.14, 28.87], "Everything is getting more expensive these days.": [29.27, 31.9], "It was quite cheap.": [32.3, 33.53], "It was a little expensive.": [33.93, 35.47], "Do you keep your receipts?": [35.87, 37.36], "As an accountant, I keep every receipt!": [37.76, 40.24], "Yes, I always keep my receipts.": [40.64, 42.71], "No, I usually throw them away.": [43.11, 45.09]}}, "transport": {"file": "c06-transport.mp3", "w": {"How do you get to work?": [0.2, 1.59], "Oh, I take the bus every day.": [1.99, 4.06], "I ride my motorbike to work.": [4.46, 6.33], "I usually take the bus.": [6.73, 8.35], "How long does it take?": [8.75, 10.23], "That's not bad at all.": [10.63, 11.99], "It takes about fifteen minutes.": [12.39, 14.21], "It takes twenty minutes.": [14.61, 15.99], "Is the traffic heavy in your city?": [16.39, 18.25], "Seattle traffic is terrible in the evening.": [18.65, 21.14], "Yes, it's crowded in the morning.": [21.54, 23.4], "No, the traffic isn't too bad.": [23.8, 25.68], "Have you ever missed a bus or a train?": [26.08, 28.17], "I almost missed my train last week!": [28.57, 30.77], "Yes, I missed a bus last year. gether!": [26.99, 29.21], "Yes, I walk every morning.": [29.61, 31.36], "Not really, but I want to exercise more.": [31.76, 34.42], "How many hours do you sleep every night?": [34.82, 37.06], "I need more sleep too!": [37.46, 38.96], "I sleep about seven hours.": [39.36, 41.11], "I only sleep six hours.": [41.51, 43.17]}}, "weather": {"file": "c09-weather.mp3", "w": {"What's the weather like today?": [0.2, 1.86], "Here in Seattle it's raining, of course!": [2.26, 4.57], "It's sunny and warm today.": [4.97, 6.59], "It's cloudy and a little cool.": [6.99, 8.74], "What is your favorite season?": [9.14, 10.78], "I love fall because of the red leaves.": [11.18, 13.51], "My favorite season is spring.": [13.91, 15.76], "I like the rainy season.": [16.16, 17.74], "Have you ever seen snow?": [18.14, 19.68], "I hope to see it this December!": [20.08, 22.04], "No, I have never seen snow.": [22.44, 24.23], "Yes, I saw snow once.": [24.63, 26.34], "Do you take an umbrella when it rains?": [26.74, 28.85], "Smart! I got completely wet last week.": [29.25, 31.75], "Yes, I always take an umbrella.": [32.15, 34.17], "No, I wear a raincoat.": [34.57, 36.19], "What will the weather be like tomorrow?": [36.59, 38.49], "Let's check the forecast together.": [38.89, 40.77], "I think it will be sunny tomorrow.": [41.17, 43.07], "It's going to rain tomorrow.": [43.47, 45.13]}}, "feelings": {"file": "c10-feelings.mp3", "w": {"How do you feel right now?": [0.2, 1.76], "Thanks for telling me.": [2.16, 3.54], "I feel happy and relaxed.": [3.94, 5.67], "I feel a little tired.": [6.07, 7.48], "What makes you nervous?": [7.88, 9.22], "Don't worry. You're doing great!": [9.62, 11.42], "Speaking English makes me nervous.": [11.82, 13.84], "Exams make me nervous.": [14.24, 15.86], "When do you feel proud of yourself?": [16.26, 18.01], "You should be proud. Learning English is hard!": [18.41, 21.08], "I feel proud when I finish my work.": [21.48, 23.53], "I'm proud when I learn something new.": [23.93, ay the guitar a little.": [22.73, 24.46], "What did you do last weekend?": [24.86, 26.57], "Sounds like a nice weekend.": [26.97, 28.67], "I visited my parents.": [29.07, 30.53], "I stayed home and relaxed.": [30.93, 32.57], "What are you going to do next weekend?": [32.97, 34.91], "Have fun!": [35.31, 36.25], "I'm going to go to the park.": [36.65, 38.31], "I'm going to cook for my family.": [38.71, 40.67]}}, "calendar": {"file": "c13-calendar.mp3", "w": {"What day is it today?": [0.2, 1.63], "Thanks! I always forget.": [2.03, 3.63], "Today is Sunday.": [4.03, 5.22], "It's Monday today.": [5.62, 6.86], "When is your birthday?": [7.26, 8.58], "I'll remember that!": [8.98, 10.26], "My birthday is in March.": [10.66, 12.33], "My birthday is on May tenth.": [12.73, 14.5], "What time do you start work?": [14.9, 16.54], "I start at nine.": [16.94, 18.22], "I start work at eight o'clock.": [18.62, 20.5], "I start at half past seven.": [20.9, 22.63], "What is your busiest day of the week?": [23.03, 24.97], "Monday is busy for me too.": [25.37, 27.16], "Monday is my busiest day.": [27.56, 29.29], "My busiest day is Friday.": [29.69, 31.39], "What are you doing tonight?": [31.79, 33.2], "Enjoy your evening!": [33.6, 34.93], "I'm studying English tonight.": [35.33, 37.03], "I'm having dinner with my family tonight.": [37.43, 39.76]}}, "numbers": {"file": "c14-numbers.mp3", "w": {"How old is your youngest family member?": [0.2, 2.5], "So young!": [2.9, 3.86], "My daughter is ten years old.": [4.26, 6.03], "She is five years old.": [6.43, 7.86], "How many English words do you know now?": [8.26, 10.4], "Great! Let's get to three thousand together.": [10.8, 13.27], "I know about five hundred words.": [13.67, 15.7], "Maybe one thousand words.": [16.1, 17.7], "How many times a week do you study English?": [18.1, 20.47], "That's very good.": [20.87, 22.0], "I study English every day.": [22.4, 24.17], "I study three times a week.": [24.57, 26.32], "What is your phone number? Just the first three numbers!": [26.72, 29.62], "Got it, thanks!": [30.02, 31.13], "It starts with zero nine eight.": [31.53, 33.36], "The first three are zero three five.": [33.76, 35.96], "How much is a cup of coffee in your city?": [36.36, 38.66], "Wow, that's cheap! Here it's five dollars.": [39.06, 41.5], "It's about twenty thousand dong.": [41.9, 43.71], "A cup of coffee costs about one dollar.": [44.11, 46.43]}}, "clothes": {"file": "c15-clothes.mp3", "w": {"What are you wearing today?": [0.2, 1.65], "That sounds nice.": [2.05, 3.27], "I'm wearing a white shirt and jeans.": [3.67, 5.65], "I'm wearing a blue T-shirt.": [6.05, 7.65], "What is your favorite color?": [8.05, 9.67], "I love green too!": [10.07, 11.42], "My favorite color is blue.": [11.82, 13.46], "I like green the most.": [13.86, 15.29], "Do you like shopping for clothes?": [15.69, 17.48], "Ana loves it more than me.": [17.88, 19.61], "Yes, I love shopping for clothes.": [20.01, 22.06], "Not really. I don't buy clothes often.": [22.46, 24.8], "What do you wear to work?": [25.2, 26.55], "Very professional!": [26.95, 28.18], "I wear a shirt and pants to work.": [28.58, 30.61], "I usually wear a dress.": [31.01, 32.53], "Do you need a coat in winter?": [32.93, 34.59], "In Seattle, I need two sweaters!": [34.99, 37.17], "Yes, I need a warm coat.": [37.57, 39.25], "No, it's not very cold here.": [39.65, 41.59]}}, "people": {"file": "c16-people.mp3", "w": {"Can you describe your best friend?": [0.2, 1.93], "She sounds lovely.": [2.33, 3.63], "She is tall with long black hair.": [4.03, 5.97], "He is short and very friendly.": [6.37, 8.29], "Do you look like your mother or your father?": [8.69, 11.02], "I look like my mom.": [11.42, 12.85], "I look like my mother.": [13.25, 14.63], "People say I look like my father.": [15.03, 16.99], "What color are your eyes?": [17.39, 18.89], "Mine are brown too.": [19.29, 20.67], "My eyes are black.": [21.07, 22.42], "I have dark brown eyes.": [22.82, 24.46], "Have you ever he ɑn ˈtuzdi ənd ˈθɝzˌdeɪ ɪz ɡrin.",[{"sp":"narrator","t":"Every day has a color: work on Monday and Wednesday is blue, and English class on Tuesday and Thursday is green."}]],["On {Friday} {evening} she meets friends, {Saturday} is for cleaning, and {Sunday} is for calling home.","Tối thứ Sáu cô gặp bạn, thứ Bảy để dọn dẹp, Chủ nhật để gọi về nhà.","be for + V-ing (dùng để làm gì)","ɑn ˈfraɪdi ˈivnɪŋ ʃi mits frɛndz, ˈsætɚdi ɪz fɚ ˈklinɪŋ, ənd ˈsʌnˌdeɪ ɪz fɚ ˈkɔlɪŋ hoʊm.",[{"sp":"narrator","t":"On Friday evening she meets friends, Saturday is for cleaning, and Sunday is for calling home."}]],["Her {year} starts in {January}, when she writes her goals on the first page.","Năm của cô bắt đầu từ tháng Một, khi cô ghi mục tiêu vào trang đầu.","in + tháng; when (mệnh đề thời gian)","hɚ jɪr stɑrts ɪn ˈdʒænjuˌɛri, wɛn ʃi raɪts hɚ ɡoʊlz ɑn ðə fɝst peɪdʒ.",[{"sp":"narrator","t":"Her year starts in January, when she writes her goals on the first page."}]],["{February} and {March} are cold and gray in Seattle, so she stays inside a lot.","Tháng Hai và tháng Ba ở Seattle lạnh và xám xịt nên cô hay ở trong nhà.","Hiện tại đơn – sự thật","ˈfɛbjəˌwɛri ənd mɑrtʃ ɚ koʊld ənd ɡreɪ ɪn siˈætəl, soʊ ʃi steɪz ɪnˈsaɪd ə lɑt.",[{"sp":"narrator","t":"February and March are cold and gray in Seattle, so she stays inside a lot."}]],["In {April} and {May}, the park is full of flowers, and {June}, {July} and {August} are the best {months|month} for camping.","Tháng Tư, tháng Năm công viên đầy hoa; tháng Sáu, Bảy, Tám là những tháng đẹp nhất để cắm trại.","So sánh nhất: the best","ɪn ˈeɪprəl ənd meɪ, ðə pɑrk ɪz fʊl əv ˈflaʊɚz, ənd dʒun, dʒuˈlaɪ ənd ˈɑɡəst ɚ ðə bɛst mʌnθs fɚ ˈkæmpɪŋ.",[{"sp":"narrator","t":"In April and May, the park is full of flowers, and June, July and August are the best months for camping."}]],["Her {birthday} is in {September}, and Ana has already planned a party.","Sinh nhật cô vào tháng Chín và Ana đã lên kế hoạch tiệc rồi.","Hiện tại hoàn thành + already","hɚ ˈbɝθˌdeɪ ɪz ɪn "ðɛr wɝ wʌn ˈprɪntɚ, tu ˈbɑksəz əv ˈpeɪpɚ ənd θri ˈsteɪpəlɚz.",[{"sp":"narrator","t":"There were one printer, two boxes of paper and three staplers."}]],["Sam counted {four} calculators, {five} lamps and {six} chairs that needed repair.","Sam đếm được bốn máy tính, năm cái đèn và sáu cái ghế cần sửa.","Mệnh đề quan hệ that","sæm ˈkaʊntɪd fɔr ˈkælkjəˌleɪtɚz, faɪv læmps ənd sɪks tʃɛrz ðət ˈnidəd rɪˈpɛr.",[{"sp":"narrator","t":"Sam counted four calculators, five lamps and six chairs that needed repair."}]],["In the {second} cabinet, they found {seven} red files, {eight} blue ones and {nine} empty folders.","Trong tủ thứ hai, họ thấy bảy tập hồ sơ đỏ, tám tập xanh và chín bìa rỗng.","ones thay cho danh từ số nhiều","ɪn ðə ˈsɛkənd ˈkæbənət, ðeɪ faʊnd ˈsɛvən rɛd faɪlz, eɪt blu wʌnz ənd naɪn ˈɛmpti ˈfoʊldɚz.",[{"sp":"narrator","t":"In the second cabinet, they found seven red files, eight blue ones and nine empty folders."}]],["On the {third} shelf, there were {ten} notebooks, {eleven} rulers and {twelve} boxes of pens.","Kệ thứ ba có mười cuốn sổ, mười một cây thước và mười hai hộp bút.","There were","ɑn ðə θɝd ʃɛlf, ðɛr wɝ tɛn ˈnoʊtˌbʊks, ɪˈlɛvən ˈrulɚz ənd twɛlv ˈbɑksəz əv pɛnz.",[{"sp":"narrator","t":"On the third shelf, there were ten notebooks, eleven rulers and twelve boxes of pens."}]],["The {fourth} and {fifth} shelves were messy: {thirteen} keyboards, {fourteen} cables, {fifteen} chargers and {sixteen} batteries.","Kệ thứ tư và thứ năm bừa bộn: 13 bàn phím, 14 dây cáp, 15 cục sạc và 16 cục pin.","Danh từ số nhiều đặc biệt: shelf → shelves","ðə fɔrθ ənd fɪfθ ʃɛlvz wɝ ˈmɛsi: ˌθɝˈtin ˈkiˌbɔrdz, ˌfɔrˈtin ˈkeɪbəlz, fɪfˈtin ˈtʃɑrdʒɚz ənd sɪkˈstin ˈbætɚiz.",[{"sp":"narrator","t":"The fourth and fifth shelves were messy: thirteen keyboards, fourteen cables, fifteen chargers and sixteen batteries."}]],["\"I've already counted {seventeen} calendars, {eighteen} mugs and {nineteen} umbrellas!\" Sam complained.","\"Mình đã đếm 17 cuốn lịch, 18 cái cốc và 19 cái ô rồi!\" Sam than.","Hiện tại hoàn thành + already","aɪv ɔlˈrɛdi ˈkaʊntɪd ˌsɛvənˈtin ˈkæləndɚz, eɪˈtin mʌɡz ənd ˌnaɪnˈtin əmˈbrɛləz! sæm kəmˈpleɪnd.",[{"sp":"Sam","t":"I've already counted seventeen calendars, eighteen mugs and nineteen umbrellas!"},{"sp":"narrator","t":"Sam complained."}]],["The storeroom held {twenty} chairs, {thirty} light bulbs and {forty} packs of sticky notes.","Kho chứa 20 cái ghế, 30 bóng đèn và 40 xấp giấy ghi chú.","Quá khứ đơn (hold – held)","ðə ˈstɔrˌrum hɛld ˈtwɛnti tʃɛrz, ˈθɝti laɪt bʌlbz ənd ˈfɔrti pæks əv ˈstɪki noʊts.",[{"sp":"narrator","t":"The storeroom held twenty chairs, thirty light bulbs and forty packs of sticky notes."}]],["They also found {fifty} envelopes, {sixty} folders, {seventy} pencils, {eighty} markers and {ninety} paper clips.","Họ còn thấy 50 phong bì, 60 bìa hồ sơ, 70 bút chì, 80 bút dạ và 90 cái kẹp giấy.","Số tròn chục -ty","ðeɪ ˈɔlsoʊ faʊnd ˈfɪfti ˈɛnvəˌloʊps, ˈsɪksti ˈfoʊldɚz, ˈsɛvənti ˈpɛnsəlz, ˈeɪti ˈmɑrkɚz ənd ˈnaɪnti ˈpeɪpɚ klɪps.",[{"sp":"narrator","t":"They also found fifty envelopes, sixty folders, seventy pencils, eighty markers and ninety paper clips."}]],["In the safe there was one {hundred} {dollars|dollar} and some {cents|cent} in petty cash.","Trong két có một trăm đô và ít xu tiền quỹ tạm ứng.","There was + N không đếm được / số tiền","ɪn ðə seɪf ðɛr wəz wʌn ˈhʌndrəd ˈdɑlɚz ənd səm sɛnts ɪn ˈpɛˌti kæʃ.",[{"sp":"narrator","t":"In the safe there was one hundred dollars and some cents in petty cash."}]],["The company spends about one {thousand} dollars on supplies a year, and its whole budget is two {million}.","Công ty chi khoảng một nghìn đô cho văn phòng phẩm mỗi năm, tổng ngân sách là hai triệu.","spend + tiền + on + N","ðə ˈkʌmpəˌni spɛndz əˈbaʊt wʌn ˈθaʊzənd ˈdɑlɚz ɑn səˈplaɪz ə jɪr, ənd ɪts hoʊl ˈbʌdʒɪt ɪz tu ˈmɪljən.",[{"sp":"narrator","t":"The company spends about one thousand dollars on supplies a year, and its whole budget is two million."}]],["Linh typed every {number} into the spreadsheet {twice} to avoid mistakes.","Linh nhập từng con số vào bảng tính hai lần để tránh sai sót.","to + V (mục đích)","lɪŋ taɪpt ˈɛvɚi ˈnʌmbɚ ˈɪntu ðə ˈsprɛdˌʃit twaɪs tə əˈvɔɪd mɪˈsteɪks.",[{"sp":"narrator","t":"Linh typed every number into the spreadsheet twice to avoid mistakes."}]],["It took {half} a day. \"Luckily, we only do this {once} a quarter,\" she smiled.","Mất nửa ngày. \"May là mỗi quý chỉ làm một lần,\" cô cười.","It takes + thời gian; once a + khoảng thời gian","ɪt tʊk hæf ə deɪ. ˈlʌkəli, wi ˈoʊnli du ðɪs wʌns ə ˈkwɔrtɚ, ʃi smaɪld.",[{"sp":"narrator","t":"It took half a day."},{"sp":"Linh","t":"Luckily, we only do this once a quarter,"},{"sp":"narrator","t":"she smiled."}]]],"drill":[[["They count the boxes every day.","ðeɪ kaʊnt ðə ˈbɑksəz ˈɛvɚi deɪ."],["They don't count the boxes every day.","ðeɪ doʊnt kaʊnt ðə ˈbɑksəz ˈɛvɚi deɪ."],["Do they count the boxes every day?","du ðeɪ kaʊnt ðə ˈbɑksəz ˈɛvɚi deɪ?"]],[["They are counting the boxes now.","ðeɪ ɚ ˈkaʊntɪŋ ðə ˈbɑksəz naʊ."],["They aren't counting the boxes now.","ðeɪ ˈɑrənt ˈkaʊntɪŋ ðə ˈbɑksəz naʊ."],["Are they counting the boxes now?","ɚ ðeɪ ˈkaʊntɪŋ ðə ˈbɑksəz naʊ?"]],[["They have already counted the boxes.","ðeɪ hæv ɔlˈrɛdi ˈkaʊntɪd ðə ˈbɑksəz."],["They haven't counted the boxes yet.","ðeɪ ˈhævənt ˈkaʊntɪd ðə ˈbɑksəz jɛt."],["Have they counted the boxes yet?","hæv ðeɪ ˈkaʊntɪd ðə ˈbɑksəz jɛt?"]],[["They have been counting the boxes for two hours.","ðeɪ hæv bɪn ˈkaʊntɪŋ ðə ˈbɑksəz fɚ tu ˈaʊɚz."],["They haven't been counting the boxes for two hours.","ðeɪ ˈhævənt bɪn ˈkaʊntɪŋ ðə ˈbɑksəz fɚ tu ˈaʊɚz."],["Have they been counting the boxes for two hours?","hæv ðeɪ bɪn ˈkaʊntɪŋ ðə ˈbɑksəz fɚ tu ˈaʊɚz?"]],[["They counted the boxes yesterday.","ðeɪ ˈkaʊntɪd ðə ˈbɑksəz ˈjɛstɚˌdeɪ."],["They didn't count the boxes yesterday.","ðeɪ ˈdɪdənt kaʊnt ðə ˈbɑksəz ˈjɛstɚˌdeɪ."],["Did they count the boxes yesterday?","dɪd ðeɪ kaʊnt ðə ˈbɑksəz ˈjɛstɚˌdeɪ?"]],[["They were counting the boxes at eight last night.","ðeɪ wɝ ˈkaʊntɪŋ ðə ly} in and meet her in the {west}.","Người anh họ sống ở bờ đông muốn bay sang gặp cô ở miền tây.","Mệnh đề quan hệ who","hɚ ˈkʌzən, hu lɪvz ɑn ðə ist koʊst, wɑnts tə flaɪ ɪn ənd mit hɚ ɪn ðə wɛst.",[{"sp":"narrator","t":"Her cousin, who lives on the east coast, wants to fly in and meet her in the west."}]],["Linh has booked a cheap {hotel} that is popular with {tourists|tourist}.","Linh đã đặt một khách sạn rẻ được khách du lịch ưa chuộng.","popular with + N","lɪŋ hæz bʊkt ə tʃip hoʊˈtɛl ðət ɪz ˈpɑpjəlɚ wɪð ˈtʊrəsts.",[{"sp":"narrator","t":"Linh has booked a cheap hotel that is popular with tourists."}]],["She doesn't need her {passport}, but she'll bring it anyway.","Cô không cần hộ chiếu, nhưng vẫn sẽ mang theo.","anyway (dù sao)","ʃi ˈdʌzənt nid hɚ ˈpæˌspɔrt, bʌt ʃil brɪŋ ɪt ˈɛniˌweɪ.",[{"sp":"narrator","t":"She doesn't need her passport, but she'll bring it anyway."}]],["Her cousin will take a {taxi} from the {airport} to the hotel.","Anh họ sẽ đi taxi từ sân bay đến khách sạn.","from … to …","hɚ ˈkʌzən wɪl teɪk ə ˈtæksi frəm ðə ˈɛrˌpɔrt tə ðə hoʊˈtɛl.",[{"sp":"narrator","t":"Her cousin will take a taxi from the airport to the hotel."}]],["\"This {country} is so big,\" Linh thinks. \"One day I want to see the {world}, not as a {visitor}, but like a local.\"","\"Đất nước này rộng quá,\" Linh nghĩ. \"Một ngày mình muốn ngắm thế giới, không phải như khách, mà như người bản địa.\"","not as …, but like …","ðɪs ˈkʌntri ɪz soʊ bɪɡ, lɪŋ θɪŋks. wʌn deɪ aɪ wɑnt tə si ðə wɝld, nɑt əz ə ˈvɪzɪtɚ, bʌt laɪk ə ˈloʊkəl.",[{"sp":"Linh","t":"This country is so big,"},{"sp":"narrator","t":"Linh thinks."},{"sp":"Linh","t":"One day I want to see the world, not as a visitor, but like a local."}]]],"drill":[[["Linh drives to California every day.","lɪŋ draɪvz tə ˌkæləˈfɔrnjə ˈɛvɚi deɪ."],["Linh doesn't drive to California every day.","lɪŋ ˈdʌzənt draɪv tə ˌkæləˈfɔrnjə ˈɛvɚi deɪ."],["Does Linh drive to California every day?","dʌz lɪŋ draɪv tə ˌkæləˈfɔrnjə ˈɛvɚi deɪ?"]],[["Linh is drivi be: Are you…?","ɚ ju ˈmɛrid? ˈænə æskt. nɑt jɛt, bʌt jɛs, ˈmeɪbi nɛkst jɪr! tɑm læft.",[{"sp":"Ana","t":"Are you married?"},{"sp":"narrator","t":"Ana asked."},{"sp":"man","t":"Not yet, but yes, maybe next year!"},{"sp":"narrator","t":"Tom laughed."}]],["Ana said her {boyfriend} works in Portland, and Linh said she wasn't married.","Ana kể bạn trai cô làm việc ở Portland, còn Linh nói mình chưa kết hôn.","Câu tường thuật; phủ định quá khứ của be: wasn't","ˈænə sɛd hɚ ˈbɔɪˌfrɛnd wɝks ɪn ˈpɔrtlənd, ənd lɪŋ sɛd ʃi ˈwɑzənt ˈmɛrid.",[{"sp":"narrator","t":"Ana said her boyfriend works in Portland, and Linh said she wasn't married."}]],["Then Tom asked about their {age} and their jobs, and they talked for twenty minutes.","Rồi Tom hỏi tuổi và công việc của họ, và họ nói chuyện hai mươi phút.","ask about + N","ðɛn tɑm æskt əˈbaʊt ðɛr eɪdʒ ənd ðɛr dʒɑbz, ənd ðeɪ tɔkt fɚ ˈtwɛnti ˈmɪnəts.",[{"sp":"narrator","t":"Then Tom asked about their age and their jobs, and they talked for twenty minutes."}]],["\"{Hey|hey}, would you like some tea? {Please|please} come in,\" Linh said.","\"Này, anh uống chút trà không? Mời vào,\" Linh nói.","Would you like + N? (lời mời)","heɪ, wʊd ju laɪk səm ti? pliz kʌm ɪn, lɪŋ sɛd.",[{"sp":"Linh","t":"Hey, would you like some tea? Please come in,"},{"sp":"narrator","t":"Linh said."}]],["\"{Thank|thank} you, that's very {nice} of you,\" Tom said. \"I'm {sorry}, but I can't today.\"","\"Cảm ơn, chị tử tế quá,\" Tom nói. \"Xin lỗi, hôm nay tôi không được.\"","Phủ định với can: can't + V","θæŋk ju, ðæts ˈvɛri naɪs əv ju, tɑm sɛd. aɪm ˈsɑri, bʌt aɪ kænt təˈdeɪ.",[{"sp":"man","t":"Thank you, that's very nice of you,"},{"sp":"narrator","t":"Tom said."},{"sp":"man","t":"I'm sorry, but I can't today."}]],["\"{OK}, no problem. Maybe tomorrow,\" Linh said with a smile.","\"Được thôi, không sao. Có lẽ để mai,\" Linh mỉm cười.","Câu rút gọn trong hội thoại","ˌoʊˈkeɪ, noʊ ˈprɑbləm. ˈmeɪbi təˈmɑˌroʊ, lɪŋ sɛd wɪð ə smaɪl.",[{"sp":"Linh","t":"OK, no problem. Maybe tomorrow,"},{"sp":"narrator","t":"Linh said with a smile."}]],["That night, Linh told her {mom} and {dad} about Tom, and her mom said her {grandparents|grandparent} also love meeting new people.","Tối đó Linh kể với bố mẹ về Tom, mẹ cô nói ông bà cũng thích gặp người mới.","love + V-ing","ðət naɪt, lɪŋ toʊld hɚ mɑm ənd dæd əˈbaʊt tɑm, ənd hɚ mɑm sɛd hɚ ˈɡrændˌpɛrənts ˈɔlsoʊ lʌv ˈmitɪŋ nu ˈpipəl.",[{"sp":"narrator","t":"That night, Linh told her mom and dad about Tom, and her mom said her grandparents also love meeting new people."}]],["When Tom left, he waved and said, \"{Bye|bye}! See you soon.\" \"{Goodbye|goodbye}!\" they answered.","Khi Tom về, anh vẫy tay: \"Chào nhé! Hẹn gặp lại.\" \"Tạm biệt!\" họ đáp.","When + quá khứ đơn","wɛn tɑm lɛft, hi weɪvd ənd sɛd, baɪ! si ju sun. ɡʊdˈbaɪ! ðeɪ ˈænsɚd.",[{"sp":"narrator","t":"When Tom left, he waved and said,"},{"sp":"man","t":"Bye! See you soon."},{"sp":"Linh","t":"Goodbye!"},{"sp":"narrator","t":"they answered."}]]],"drill":[[["Linh meets her new neighbor every day.","lɪŋ mits hɚ nu ˈneɪbɚ ˈɛvɚi deɪ."],["Linh doesn't meet her new neighbor every day.","lɪŋ ˈdʌzənt mit hɚ nu ˈneɪbɚ ˈɛvɚi deɪ."],["Does Linh meet her new neighbor every day?","dʌz lɪŋ mit hɚ nu ˈneɪbɚ ˈɛvɚi deɪ?"]],[["Linh is meeting her new neighbor now.","lɪŋ ɪz ˈmitɪŋ hɚ nu ˈneɪbɚ naʊ."],["Linh isn't meeting her new neighbor now.","lɪŋ ˈɪzənt ˈmitɪŋ hɚ nu ˈneɪbɚ naʊ."],["Is Linh meeting her new neighbor now?","ɪz lɪŋ ˈmitɪŋ hɚ nu ˈneɪbɚ naʊ?"]],[["Linh has already met her new neighbor.","lɪŋ hæz ɔlˈrɛdi mɛt hɚ nu ˈneɪbɚ."],["Linh hasn't met her new neighbor yet.","lɪŋ ˈhæzənt mɛt hɚ nu ˈneɪbɚ jɛt."],["Has Linh met her new neighbor yet?","hæz lɪŋ mɛt hɚ nu ˈneɪbɚ jɛt?"]],[["Linh has been meeting her new neighbor for two hours.","lɪŋ hæz bɪn ˈmitɪŋ hɚ nu ˈneɪbɚ fɚ tu ˈaʊɚz."],["Linh hasn't been meeting her new neighbor for two hours.","lɪŋ ˈhæzənt bɪn ˈmitɪŋ hɚ nu ˈneɪbɚ fɚ tu ˈaʊɚz."],["Has Linh been meeting her new neighbor for two hours?","hæz lɪŋ bɪn ˈmi (nên) – chỉ kết quả","ˈænə hæd ə dʒɑb ˈɪntɚˌvju ɑn ˈmʌndi, soʊ lɪŋ hɛlpt hɚ ˈpræktəs ɑn ˈsʌnˌdeɪ naɪt.",[{"sp":"narrator","t":"Ana had a job interview on Monday, so Linh helped her practice on Sunday night."}]],["\"I'll {ask} you some questions, just like a real manager,\" Linh said.","\"Mình sẽ hỏi bạn vài câu, giống hệt quản lý thật,\" Linh nói.","Tương lai đơn: I'll = I will","aɪl æsk ju səm ˈkwɛstʃənz, dʒʌst laɪk ə ril ˈmænədʒɚ, lɪŋ sɛd.",[{"sp":"Linh","t":"I'll ask you some questions, just like a real manager,"},{"sp":"narrator","t":"Linh said."}]],["\"{What|what} is your full name, and {where} do you live?\" Linh asked.","\"Tên đầy đủ của bạn là gì, và bạn sống ở đâu?\" Linh hỏi.","Wh- + do + S + V?","wʌt ɪz jɚ fʊl neɪm, ənd wɛr du ju laɪv? lɪŋ æskt.",[{"sp":"Linh","t":"What is your full name, and where do you live?"},{"sp":"narrator","t":"Linh asked."}]],["Ana gave her name and {address}. \"This part is easy!\" she laughed.","Ana đọc tên và địa chỉ. \"Phần này dễ!\" cô cười.","Quá khứ đơn (give – gave)","ˈænə ɡeɪv hɚ neɪm ənd ˈæˌdrɛs. ðɪs pɑrt ɪz ˈizi! ʃi læft.",[{"sp":"narrator","t":"Ana gave her name and address."},{"sp":"Ana","t":"This part is easy!"},{"sp":"narrator","t":"she laughed."}]],["\"{When|when} did you start your last job, and {why} did you leave?\" Linh asked.","\"Bạn bắt đầu công việc trước khi nào, và tại sao bạn nghỉ?\" Linh hỏi.","Wh- + did + S + V? (nghi vấn quá khứ)","wɛn dɪd ju stɑrt jɚ læst dʒɑb, ənd waɪ dɪd ju liv? lɪŋ æskt.",[{"sp":"Linh","t":"When did you start your last job, and why did you leave?"},{"sp":"narrator","t":"Linh asked."}]],["\"I started three years ago. The {reason} is simple: I want to learn more,\" Ana said.","\"Tôi bắt đầu ba năm trước. Lý do đơn giản: tôi muốn học hỏi thêm,\" Ana nói.","ago (trước đây) + quá khứ đơn","aɪ ˈstɑrtɪd θri jɪrz əˈɡoʊ. ðə ˈrizən ɪz ˈsɪmpəl: aɪ wɑnt tə lɝn mɔr, ˈænə sɛd.",[{"sp":"Ana","t":"I started three years ago. The reason is simple: I want to learn more,"},{"sp":"narrator","t":"Ana said."}]],["\"{Who|who} was your manager, and {how} did you work with your team?\" Linh asked.","\"Quản lý của bạn là ai, và bạn làm việc với nhóm thế nào?\" Linh hỏi.","Who + was…? / How + did…?","hu wəz jɚ ˈmænədʒɚ, ənd haʊ dɪd ju wɝk wɪð jɚ tim? lɪŋ æskt.",[{"sp":"Linh","t":"Who was your manager, and how did you work with your team?"},{"sp":"narrator","t":"Linh asked."}]],["Ana wasn't {sure} about one question, so she tried to {guess} the answer.","Ana không chắc về một câu, nên cô thử đoán câu trả lời.","Phủ định be quá khứ: wasn't + adj","ˈænə ˈwɑzənt ʃʊr əˈbaʊt wʌn ˈkwɛstʃən, soʊ ʃi traɪd tə ɡɛs ðə ˈænsɚ.",[{"sp":"narrator","t":"Ana wasn't sure about one question, so she tried to guess the answer."}]],["\"{Which|which} job do you want more: this one or the bank job?\" \"{Maybe|maybe} this one. I {think} it's more interesting.\"","\"Bạn muốn công việc nào hơn: việc này hay việc ở ngân hàng?\" \"Có lẽ việc này. Mình nghĩ nó thú vị hơn.\"","Which + N + do you…?","wɪtʃ dʒɑb du ju wɑnt mɔr: ðɪs wʌn ɔr ðə bæŋk dʒɑb? ˈmeɪbi ðɪs wʌn. aɪ θɪŋk ɪts mɔr ˈɪntrəstɪŋ.",[{"sp":"Linh","t":"Which job do you want more: this one or the bank job?"},{"sp":"Ana","t":"Maybe this one. I think it's more interesting."}]],["\"Is it {true} that the company is very big?\" Ana asked. \"I don't {know}. That {information} might be {false},\" Linh answered.","\"Có đúng là công ty rất lớn không?\" Ana hỏi. \"Mình không biết. Thông tin đó có thể sai,\" Linh đáp.","Is it true that…? · I don't know.","ɪz ɪt tru ðət ðə ˈkʌmpəˌni ɪz ˈvɛri bɪɡ? ˈænə æskt. aɪ doʊnt noʊ. ðət ˌɪnfɚˈmeɪʃən maɪt bi fɔls, lɪŋ ˈænsɚd.",[{"sp":"Ana","t":"Is it true that the company is very big?"},{"sp":"narrator","t":"Ana asked."},{"sp":"Linh","t":"I don't know. That information might be false,"},{"sp":"narrator","t":"Linh answered."}]],["\"In my {opinion}, you should {probably} talk about your accounting skills,\" Linh said. \"That's a good {idea}!\"","\"Theo mình, có lẽ bạn nên nói về kỹ năng kế toán,\" Linh nói. \"Ý hay đấy ,[{"sp":"narrator","t":"When Linh and Ana came home, Ana's cat, Milo, wasn't in the apartment."}]],["\"Is he {under} the bed?\" Linh asked. \"No, he isn't. And he isn't {on} the sofa,\" Ana said.","\"Nó ở dưới gầm giường à?\" Linh hỏi. \"Không. Nó cũng không ở trên sô-pha,\" Ana nói.","Is he…? — No, he isn't.","ɪz hi ˈʌndɚ ðə bɛd? lɪŋ æskt. noʊ, hi ˈɪzənt. ənd hi ˈɪzənt ɑn ðə ˈsoʊfə, ˈænə sɛd.",[{"sp":"Linh","t":"Is he under the bed?"},{"sp":"narrator","t":"Linh asked."},{"sp":"Ana","t":"No, he isn't. And he isn't on the sofa,"},{"sp":"narrator","t":"Ana said."}]],["They looked {behind} the door and {between} the boxes.","Họ tìm sau cánh cửa và giữa các thùng đồ.","Giới từ vị trí","ðeɪ lʊkt bɪˈhaɪnd ðə dɔr ənd bɪˈtwin ðə ˈbɑksəz.",[{"sp":"narrator","t":"They looked behind the door and between the boxes."}]],["Then they went {out} of the building and looked {around} the yard.","Rồi họ ra khỏi tòa nhà và tìm quanh sân.","go out of + nơi chốn","ðɛn ðeɪ wɛnt aʊt əv ðə ˈbɪldɪŋ ənd lʊkt ɚˈaʊnd ðə jɑrd.",[{"sp":"narrator","t":"Then they went out of the building and looked around the yard."}]],["A neighbor said, \"I saw a gray cat {near} the mailbox {at} six o'clock.\"","Một người hàng xóm nói: \"Tôi thấy một con mèo xám gần hộp thư lúc sáu giờ.\"","at + giờ","ə ˈneɪbɚ sɛd, aɪ sɔ ə ɡreɪ kæt nɪr ðə ˈmeɪlˌbɑks ət sɪks əˈklɑk.",[{"sp":"narrator","t":"A neighbor said,"},{"sp":"woman","t":"I saw a gray cat near the mailbox at six o'clock."}]],["The mailbox is {next to} the bus stop, {opposite} the park.","Hộp thư ở cạnh trạm xe buýt, đối diện công viên.","next to / opposite","ðə ˈmeɪlˌbɑks ɪz nɛkst tə ðə bʌs stɑp, ˈɑpəzət ðə pɑrk.",[{"sp":"narrator","t":"The mailbox is next to the bus stop, opposite the park."}]],["They walked {across} the street and {through} the park.","Họ băng qua đường và đi xuyên công viên.","across / through","ðeɪ wɔkt əˈkrɔs ðə strit ənd θru ðə pɑrk.",[{"sp":"narrator","t":"They walked across the street and through the park."}]],["Suddenly, Linh looked {u t} month,\" Linh said.","\"Bạn đã bao giờ bỏ lỡ buổi học nào chưa?\" Ana hỏi. \"Chỉ một lần, tháng trước,\" Linh nói.","Have you ever + V3? (hiện tại hoàn thành)","hæv ju ˈɛvɚ mɪst ə klæs? ˈænə æskt. ˈoʊnli wʌns, læst mʌnθ, lɪŋ sɛd.",[{"sp":"Ana","t":"Have you ever missed a class?"},{"sp":"narrator","t":"Ana asked."},{"sp":"Linh","t":"Only once, last month,"},{"sp":"narrator","t":"Linh said."}]],["\"I've {just} finished my homework. I'll check it {again} {later},\" Linh said.","\"Mình vừa làm xong bài tập. Lát nữa mình sẽ kiểm tra lại,\" Linh nói.","Hiện tại hoàn thành với just","aɪv dʒʌst ˈfɪnɪʃt maɪ ˈhoʊmˌwɝk. aɪl tʃɛk ɪt əˈɡɛn ˈleɪtɚ, lɪŋ sɛd.",[{"sp":"Linh","t":"I've just finished my homework. I'll check it again later,"},{"sp":"narrator","t":"Linh said."}]],["\"{Next|next} year, I want to speak English well. I'll take the exam {soon},\" she added.","\"Năm sau mình muốn nói tiếng Anh tốt. Mình sẽ sớm đi thi,\" cô nói thêm.","Tương lai đơn: I'll + V","nɛkst jɪr, aɪ wɑnt tə spik ˈɪŋɡlɪʃ wɛl. aɪl teɪk ðə ɪɡˈzæm sun, ʃi ˈædəd.",[{"sp":"Linh","t":"Next year, I want to speak English well. I'll take the exam soon,"},{"sp":"narrator","t":"she added."}]],["That night, she smiled and thought about her {future}.","Tối đó cô mỉm cười nghĩ về tương lai của mình.","think about + N","ðət naɪt, ʃi smaɪld ənd θɔt əˈbaʊt hɚ ˈfjutʃɚ.",[{"sp":"narrator","t":"That night, she smiled and thought about her future."}]]],"drill":[[["She calls her mom every day.","ʃi kɔlz hɚ mɑm ˈɛvɚi deɪ."],["She doesn't call her mom every day.","ʃi ˈdʌzənt kɔl hɚ mɑm ˈɛvɚi deɪ."],["Does she call her mom every day?","dʌz ʃi kɔl hɚ mɑm ˈɛvɚi deɪ?"]],[["She is calling her mom now.","ʃi ɪz ˈkɔlɪŋ hɚ mɑm naʊ."],["She isn't calling her mom now.","ʃi ˈɪzənt ˈkɔlɪŋ hɚ mɑm naʊ."],["Is she calling her mom now?","ɪz ʃi ˈkɔlɪŋ hɚ mɑm naʊ?"]],[["She has already called her mom.","ʃi hæz ɔlˈrɛdi kɔld hɚ mɑm."],["She hasn't called her mom yet.","ʃi ˈhæzənt kɔld hɚ mɑm jɛt."],["Has she called her mom yet?","hæz ʃi kɔld const CLOUD={ref:null,state:'local',timer:null};
function setCloud(st){CLOUD.state=st;const el=document.getElementById('sync');if(el)el.innerHTML=syncHtml()}
function syncHtml(){return CLOUD.state==='ok'?'<span class="sync ok">☁ Đã lưu vào tài khoản Claude của bạn</span>':CLOUD.state==='saving'?'<span class="sync">☁ Đang lưu…</span>':CLOUD.state==='wait'?'<span class="sync">☁ Đang kết nối tài khoản…</span>':CLOUD.state==='err'?'<span class="sync warn">Chưa lưu được lên tài khoản, đang giữ trên máy này</span>':(LS_OK?'<span class="sync ok">✓ Đã lưu trên máy này ('+learned.size+' từ). Nên Sao lưu định kỳ.</span>':'<span class="sync warn">⚠ Trình duyệt đang chặn lưu dữ liệu, có thể do đang mở ở chế độ Riêng tư. Hãy mở bằng tab thường hoặc từ biểu tượng ngoài màn hình chính.</span>')}
function cloudSave(){if(!CLOUD.ref)return;clearTimeout(CLOUD.timer);setCloud('saving');CLOUD.timer=setTimeout(async()=>{try{await CLOUD.ref.set({learned:[...learned],pins:[...PINS],pron:PRON,act:ACT,updatedAt:Date.now()});setCloud('ok')}catch(e){setCloud('err')}},1200)}
async function cloudInit(){
  if(!(window.claude&&typeof window.claude.use==='function'))return;
  setCloud('wait');
  try{const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const uid=user?await user.id():null; if(!db||!uid){setCloud('local');return}
    const ref=db.doc('data/users/'+uid+'/progress'); const snap=await ref.get();
    const remote=snap.exists&&Array.isArray(snap.data().learned)?snap.data().learned:[];
    const before=learned.size; remote.forEach(k=>learned.add(k));
    const d0=snap.exists?snap.data():{}; let extra=false;
    if(Array.isArray(d0.pins)) d0.pins.forEach(k=>{if(!PINS.has(k)){PINS.add(k);extra=true}});
    if(d0.act&&typeof d0.act==='object') Object.entries(d0.act).forEach(([d,o])=>{if(o&&typeof o==='object'){ACT[d]=ACT[d]||{}; Object.entries(o).forEach(([k,v])=>{if(typeof v==='number'&&!(ACT[d][k]>=v)){ACT[d][k]=v;extra=true}})}});
    if(d0.pron&&typeof d0.pron==='object') Object.entries(d0.pron).forEach(([k,v])=>{if(typeof v==='number'&&!(PRON[k]>=v)){PRON[k]=v;extra=true}});
    persistLocal();
    CLOUD.ref=ref;
    if(remote.length!==learned.size||extra||!Array.isArray(d0.pins)){ cloudSave() } else setCloud('ok');
    if(learned.size!==before) refresh();
  }catch(e){setCloud('local')}}
function backupCode(){return 'LINH3000:'+btoa(unescape(encodeURIComponent(JSON.stringify({v:3,learned:[...learned],pins:[...PINS],pron:PRON,act:ACT}))))}
function restoreCode(txt){const t=String(txt||''); const i=t.lastIndexOf('LINH3000:'); if(i<0) throw 0; const b=t.slice(i+9).replace(/[^A-Za-z0-9+/=]/g,''); const o=JSON.parse(decodeURIComponent(escape(atob(b)))); if(!Array.isArray(o.learned)) throw 0; let n=0; o.learned.forEach(k=>{if(typeof k==='string'&&!learned.has(k)){learned.add(k);n++}}); if(Array.isArray(o.pins)) o.pins.forEach(k=>typeof k==='string'&&PINS.add(k)); if(o.act&&typeof o.act==='object') Object.entries(o.act).forEach(([d,x])=>{if(x&&typeof x==='object'){ACT[d]=ACT[d]||{}; Object.entries(x).forEach(([k,v])=>{if(typeof v==='number'&&!(ACT[d][k]>=v)) ACT[d][k]=v})}}); if(o.pron&&typeof o.pron==='object') Object.entries(o.pron).forEach(([k,v])=>{if(typeof v==='number'&&!(PRON[k]>=v)) PRON[k]=v}); persist(); return n}

const WMAP={}; if(typeof WTIMINGS!=='undefined') Object.values(WTIMINGS).forEach(L=>Object.entries(L.w).forEach(([w,se])=>{const k=w.toLowerCase(); if(!WMAP[k]) WMAP[k]={f:L.file,s:se[0],e:se[1]}}));
const WA={el:null,end:0};
function wordEl(){ if(!WA.el){ WA.el=new Audio(); WA.el.preload='auto'; WA.el.setAttribute('playsinline',''); WA.el.addEventListener('timeupdate',()=>{ if(WA.el.currentTime>=WA.end) WA.el.pause() }) } return WA.el }
function toast(msg){let t=document.getElementById('toast'); if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)} t.textContent=msg; t.hidden=false; clearTimeout(t._h); t._h=setTimeout(()=>{t.hidden=true},4200)}
function speak(t,rate){
  const e=WMAP[String(t).trim().toLowerCase()];
  if(e){ const el=wordEl(); if(AUD.el&&!AUD.el.paused) AUD.el.pause();
    (async()=>{ try{ await ensure(el,e.f); WA.end=e.e; el.currentTime=e.s; await el.play() }catch(x){ toast(failMsg(x)) } })();
    return }
  if(!canSpeak){toast('Từ này chưa có file âm thanh trên thiết bị này.');return}
  oldSpeak(t,rate)}
function oldSpeak(t,rate){if(!canSpeak)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(usVoice)u.voice=usVoice;u.rate=rate||0.9;speechSynthesis.speak(u)}catch(e){}}
const sayBtn=(t,label)=>(canSpeak||WMAP[String(t).trim().toLowerCase()])?`<button class="${label?'say':'ic'}" data-say="${esc(t)}" aria-label="Nghe">${label||'🔊'}</button>`:'';

const plain=s=>s.replace(/\{([^}|]+)(?:\|[^}]+)?\}/g,'$1');
function marked(s,lid){return esc(s).replace(/\{([^}|]+)(?:\|([^}]+))?\}/g,(m,sur,lem)=>{lem=lem||sur;const ok=learned.has(keyOf(lid,lem));return `<button class="w${ok?' ok':''}" data-l="${lid}" data-w="${esc(lem)}">${sur}</button>`})}
function exampleFor(L,w){const s=L.story.find(s=>[...s[0].matchAll(/\{([^}|]+)(?:\|([^}]+))?\}/g)].some(m=>(m[2]||m[1])===w));return s?s[0].replace(/\{([^}|]+)(?:\|([^}]+))?\}/g,(m,sur,lem)=>(lem||sur)===w?'<b>'+sur+'</b>':sur):''}

function ring(p){const r=16,c=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="${r}" fill="none" stroke="var(--soft)" stroke-width="4"/><circle cx="20" cy="20" r="${r}" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 20 20)"/><text x="20" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${Math.round(p*100)}</text></svg>`}

const BLOB={}, READY={};
function loadAudio(f){ if(typeof AUDIO_DATA!=='undefined'&&AUDIO_DATA[f]) return Promise.resolve(READY[f]=AUDIO_DATA[f]);
  if(!BLOB[f]) BLOB[f]=fetch('audio/'+f).then(r=>{if(!r.ok) throw new Error('HTTP '+r.status); return r.arrayBuffer()}).then(b=>READY[f]=URL.createObjectURL(new Blob([b],{type:'audio/mpeg'}))).catch(e=>{delete BLOB[f]; throw e});
  return BLOB[f]}
function prefetch(f){ if(f) loadAudio(f).catch(()=>{}) }
function mkAudio(){const a=new Audio(); a.preload='auto'; a.setAttribute('playsinline',''); return a}
AUD.el=mkAudio(); AUD.el.ontimeupdate=onTU; AUD.el.onpause=onTU; AUD.el.onended=()=>{AUD.now=-1;markNow();syncBtn()};
let unlocked=false;
document.addEventListener('pointerdown',()=>{ if(unlocked) return; unlocked=true;
  [AUD.el, wordEl()].forEach(el=>{ if(!el._f){ el.src=SIL; const p=el.play(); if(p&&p.then) p.then(()=>{ if(!el._f) el.pause() }).catch(()=>{}) } }) },{capture:true});
function waitMeta(el){return el.readyState>=1?Promise.resolve():new Promise((ok,no)=>{const t=setTimeout(()=>no(new Error('timeout')),15000); el.addEventListener('loadedmetadata',()=>{clearTimeout(t);ok()},{once:true}); el.addEventListener('error',()=>{clearTimeout(t);no(new Error('decode'))},{once:true})})}
async function ensure(el,f){ if(el._f===f) return; if(!READY[f]) toast('Đang tải âm thanh…'); const url=await loadAudio(f); el.src=url; el._f=f; el.load(); await waitMeta(el); el.playbackRate=el===AUD.el?rate:1 }
function failMsg(e){ const m=String(e&&e.message||e||''); return /HTTP|fetch|network|Failed/i.test(m)?'Không tải được âm thanh ('+m+'). Kiểm tra mạng rồi bấm lại.':'Không phát được ('+(e&&e.name||m)+'). Tăng âm lượng, tắt chế độ im lặng rồi bấm lại.' }
function onTU(){const a=AUD.el; if(!a||!AUD.lid) return; const T=TIM(AUD.lid); if(!T) return; const t=a.currentTime;
  if(AUD.end!=null&&t>=AUD.end){a.pause();AUD.end=null}
  const i=a.paused&&AUD.end==null&&t===0?-1:T.t.findIndex(x=>t>=x[0]-0.05&&t<x[1]+0.6); if(i!==AUD.now){AUD.now=a.paused&&AUD.end==null?(t>0&&i>=0?i:-1):i;markNow()} syncBtn()}
function markNow(){document.querySelectorAll('.sent').forEach(e=>e.classList.toggle('now',state.view==='lesson'&&AUD.lid===state.id&&+e.dataset.i===AUD.now&&!AUD.el.paused))}

async function playAll(L){logAct('story');const T=TIM(L.id), a=AUD.el; if(!T) return ttsSegs(L.story.flatMap(s=>s[4]));

  try{ if(WA.el) WA.el.pause(); await ensure(a,T.file); AUD.lid=L.id; AUD.end=T.t[i][1]; AUD.now=i; a.currentTime=T.t[i][0]; await a.play(); markNow() }catch(e){toast(failMsg(e))}}
const PITCH={narrator:1,Linh:1.15,Ana:1.35,Sam:0.9,Brown:0.7,Ortiz:1.05,Joe:0.75,man:0.85,woman:1.2};
function ttsSegs(segs){if(!canSpeak)return;try{speechSynthesis.cancel();segs.forEach(g=>{const u=new SpeechSynthesisUtterance(g.t);u.lang='en-US';if(usVoice)u.voice=usVoice;u.rate=0.9*rate;u.pitch=PITCH[g.sp]||1;speechSynthesis.speak(u)})}catch(e){}}
async function downloadMp3(L){const T=TIM(L.id), m=$('#dlmsg'); const say=t=>{if(m)m.textContent=t};
  const mp4=T.file.replace(/\.mp3$/,'.mp4');
  const viewer=window.claude&&typeof window.claude.use==='function';
  if(!viewer){const a=document.createElement('a');a.href=SRC(T.file);a.download=T.file;document.body.appendChild(a);a.click();a.remove();say('Đang tải '+T.file);return}
  say('Đang chuẩn bị…');
  try{const d=await window.claude.use('downloads'); if(!d){say('Chế độ xem này không cho tải file.');return}
    const blob=await (await fetch('audio/'+mp4)).blob();
    await d.save({filename:mp4,data:blob}); say('Đã lưu file âm thanh '+mp4+'. Mở bằng trình phát nhạc/video là nghe được.')}
  catch(e){say(e&&e.code==='declined'?'Bạn đã hủy tải.':'Chưa tải được ('+((e&&e.code)||'lỗi mạng')+'). Thử lại sau.')}}

/* ---------- LUYỆN PHÁT ÂM (nhận giọng nói của trình duyệt) ---------- */
const SRx=window.SpeechRecognition||window.webkitSpeechRecognition;
const IN_CLAUDE=!!(window.claude&&typeof window.claude.use==='function');
const CAN_REC=!!SRx&&!IN_CLAUDE;
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function n2w(n){n=+n; if(n<20) return ONES[n]; if(n<100) return TENS[Math.floor(n/10)]+(n%10?' '+ONES[n%10]:''); if(n<1000) return ONES[Math.floor(n/100)]+' hundred'+(n%100?' '+n2w(n%100):''); if(n<1e6) return n2w(Math.floor(n/1000))+' thousand'+(n%1000?' '+n2w(n%1000):''); return String(n)}
function toks(s){return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/\bwon't\b/g,'will not').replace(/\bcan't\b/g,'can not').replace(/\bcannot\b/g,'can not').replace(/n't\b/g,' not').replace(/'ve\b/g,' have').replace(/'re\b/g,' are').replace(/'ll\b/g,' will').replace(/\bi'm\b/g,'i am').replace(/'d\b/g,' would').replace(/\blet's\b/g,'let us').replace(/(\d+)(st|nd|rd|th)\b/g,'$1').replace(/\$(\d+)/g,'$1 dollars').replace(/%/g,' percent').replace(/\d+/g,m=>' '+n2w(m)+' ').replace(/[-–—]/g,' ').replace(/[^a-z' ]+/g,' ').split(/\s+/).map(w=>w.replace(/^'+|'+$/g,'')).filter(Boolean)}
const SAME={to:'two',too:'two',for:'four',ok:'okay',mr:'mister',ms:'miz',t:'tee'};
const eq=(a,b)=>a===b||(SAME[a]||a)===(SAME[b]||b)||a.replace(/'/g,'')===b.replace(/'/g,'');
function align(target,heard){const n=target.length,m=heard.length,d=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=eq(target[i],heard[j])?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  const ok=new Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(eq(target[i],heard[j])){ok[i]=true;i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++}return ok}
let REC=null;
function pronounce(text){
  const target=toks(text), words=String(text).replace(/[“”"]/g,'').split(/\s+/).filter(Boolean);
  $('#sheetHost').innerHTML=`<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-label="Luyện phát âm">
    <span class="eyebrow">Luyện phát âm</span>
    <div class="pr-target" id="prT">${words.map(w=>`<span class="pw">${esc(w)}</span>`).join(' ')}</div>
    <div class="pl-row">${sayBtn(text,'🔊 Nghe mẫu')}</div>
    <button class="mic" id="prGo" aria-label="Bấm rồi đọc">🎤</button>
    <div class="pr-status" id="prS">Bấm 🎤 rồi đọc to, rõ ràng.</div>
    <div class="muted" id="prH" style="font-size:14px"></div>
    <div class="fc-actions"><button class="btn" data-close>Đóng</button><button class="btn primary" id="prAgain" hidden>Thử lại</button></div></div>`;
  const go=$('#prGo'),st=$('#prS'),hd=$('#prH'),again=$('#prAgain');
  const start=()=>{ if(REC){try{REC.abort()}catch(e){}} if(AUD.el)AUD.el.pause(); if(WA.el)WA.el.pause();
    const r=new SRx(); REC=r; r.lang='en-US'; r.interimResults=true; r.maxAlternatives=5; r.continuous=false;
    let finals=[], interim='';
    go.classList.add('on'); st.textContent='Đang nghe… hãy đọc'; hd.textContent=''; again.hidden=true;
    r.onresult=ev=>{interim='';for(let k=ev.resultIndex;k<ev.results.length;k++){const res=ev.results[k]; if(res.isFinal){finals.push([...res].map(a=>a.transcript))} else interim+=res[0].transcript} hd.textContent=interim?'Máy nghe: '+interim:''};
    r.onerror=ev=>{go.classList.remove('on'); again.hidden=false;
      st.textContent=ev.error==='not-allowed'||ev.error==='service-not-allowed'?'Chưa cho phép dùng micro. Vào Cài đặt → Safari → Micrô, chọn Cho phép, rồi thử lại.':ev.error==='no-speech'?'Không nghe thấy tiếng. Đưa điện thoại gần miệng hơn và thử lại.':ev.error==='network'?'Cần có mạng để nhận giọng nói.':'Có lỗi ('+ev.error+'). Thử lại nhé.'};
    r.onend=()=>{go.classList.remove('on'); if(!finals.length){ if(!st.textContent.startsWith('Chưa')&&!st.textContent.startsWith('Không')&&!st.textContent.startsWith('Cần')&&!st.textContent.startsWith('Có lỗi')){st.textContent='Không nghe rõ. Thử lại nhé.'} again.hidden=false; return }
      const alts=finals.length===1?finals[0]:[finals.map(f=>f[0]).join(' ')];
      let best=null; alts.forEach(a=>{const ok=align(target,toks(a)); const sc=ok.filter(Boolean).length; if(!best||sc>best.sc) best={a,ok,sc}});
      showResult(best)};
    try{r.start()}catch(e){st.textContent='Không mở được micro.';go.classList.remove('on')} };
  function showResult(b){
    // map target tokens back to displayed words
    let ti=0; const spans=[...document.querySelectorAll('#prT .pw')];
    spans.forEach(sp=>{const n=toks(sp.textContent).length; if(!n){sp.className='pw';return} const ok=b.ok.slice(ti,ti+n).every(Boolean); ti+=n; sp.className='pw '+(ok?'good':'bad')});

    hd.textContent='Máy nghe được: “'+b.a+'”'; again.hidden=false;
    if(target.length===1&&pct===100){ const k=findKeyFor(text); if(k){learned.add(k);persist()} }
  }

}
function findKeyFor(t){const w=String(t).trim().toLowerCase(); for(const L of LESSONS){const x=L.words.find(x=>x.w.toLowerCase()===w); if(x) return keyOf(L.id,x.w)} return null}

function recErrMsg(e){return e==='not-allowed'||e==='service-not-allowed'?'Chưa cho phép micro/nhận giọng nói. Vào Cài đặt → Safari → Micrô (và Nhận dạng giọng nói), chọn Cho phép.':e==='no-speech'?'Không nghe thấy tiếng. Nói to và gần micro hơn.':e==='network'?'Cần có mạng để nhận giọng nói.':e==='aborted'?'Đã dừng.':'Có lỗi ('+e+'). Thử lại nhé.'}
function recOnce(text,onInterim){return new Promise((res,rej)=>{
  if(!CAN_REC) return rej('unsupported');
  if(REC){try{REC.abort()}catch(e){}} if(AUD.el)AUD.el.pause(); if(WA.el)WA.el.pause();
  const target=toks(text); const r=new SRx(); REC=r; r.lang='en-US'; r.interimResults=true; r.maxAlternatives=5; r.continuous=false;
  let finals=[], err=null;
  r.onresult=ev=>{let interim='';for(let k=ev.resultIndex;k<ev.results.length;k++){const x=ev.results[k]; if(x.isFinal) finals.push([...x].map(a=>a.transcript)); else interim+=x[0].transcript} if(onInterim&&interim) onInterim(interim)};
  r.onerror=ev=>{err=ev.error};
  r.onend=()=>{ if(!finals.length) return rej(err||'no-speech');
    const alts=finals.length===1?finals[0]:[finals.map(f=>f[0]).join(' ')]; let best=null;
    alts.forEach(a=>{const h=toks(a); let ok=align(target,h); if(target.length===1&&h.some(w=>eq(w,target[0]))) ok=[true]; const sc=ok.filter(Boolean).length; if(!best||sc>best.sc) best={heard:a,ok,sc}});
    res({...best,target,pct:Math.round(best.sc/Math.max(1,target.length)*100)}) };
  try{r.start()}catch(e){rej('start')} })}
const NO_MIC_NOTE=IN_CLAUDE?'Micro bị chặn trong Claude. Mở bản web trên Safari (minmin66322-sudo.github.io/hoc-tu-vung) để được chấm điểm.':'Trình duyệt này chưa hỗ trợ nhận giọng nói. Trên iPhone hãy dùng Safari.';

let CH=null;

async function chatAsk(L){ const c=L.chat[CH.i]; CH.log.push({who:'linh',t:c.q,ipa:c.qi,vi:c.qvi}); CH.tries=0; renderChat(L); CH.busy=true; await playLine(L,c.q); CH.busy=false }
function judge(c,heard){ const h=toks(heard), hs=' '+h.join(' ')+' '; let best=0,bi=0;
  c.a.forEach((a,i)=>{const t=toks(a[0]); const ok=align(t,h); const r=ok.filter(Boolean).length/Math.max(1,t.length); if(r>best){best=r;bi=i}});
  const kw=c.kw.some(k=>{const kt=toks(k).join(' '); return kt&&hs.includes(' '+kt+' ')});
  return {best:Math.round(best*100),bi,accepted:best>=0.7||(kw&&h.length>=2)||best>=0.5&&kw} }
async function chatAnswer(L,heard,fromHint){ const c=L.chat[CH.i]; const j=judge(c,heard); CH.tries++;

  if(j.accepted||fromHint){ if(!fromHint) CH.ok++; CH.log.push({who:'linh',t:c.re}); renderChat(L); CH.busy=true; await playLine(L,c.re); CH.busy=false;
    CH.i++; if(CH.i>=L.chat.length){ CH.done=true; CH.log.push({who:'end'}); logAct('chat'); renderChat(L); return } await chatAsk(L) }

/* ---------- FLASHCARDS ---------- */
let deck=[],fi=0,flipped=false;
function startFlash(L){deck=[...L.words].sort((a,b)=>learned.has(keyOf(L.id,a.w))-learned.has(keyOf(L.id,b.w))||Math.random()-.5);fi=0;flipped=false;drawFlash(L)}
function drawFlash(L){
  const p=$('#panel');
  if(fi>=deck.length){p.innerHTML=`<section class="card" style="text-align:center"><div class="score">${lessonDone(L)}/${L.words.length}</div><p>Bạn đã xem hết bộ thẻ. Số từ đã thuộc trong chương này ở trên.</p><button class="btn primary" id="again">Ôn lại từ đầu</button></section>`;$('#again').onclick=()=>startFlash(L);return}
  const w=deck[fi];
  p.innerHTML=`<div class="count">Thẻ ${fi+1} / ${deck.length} · chạm thẻ để lật</div>
  <button class="fc" id="fc">${flipped?`<div style="display:grid;gap:8px"><span class="big" style="font-size:26px">${esc(w.vi)}</span><span class="ipa">${esc(w.w)} · /${w.ipa}/</span><span class="ex">${exampleFor(L,w.w)}</span></div>`:`<div style="display:grid;gap:6px"><span class="big">${esc(w.w)}</span><span class="ipa">/${w.ipa}/</span><span class="muted">${w.p}</span></div>`}</button>
  <div class="toolbar" style="justify-content:center">${sayBtn(w.w,'🔊 nghe từ')}</div>
  <div class="fc-actions"><button class="btn" id="no">Chưa nhớ</button><button class="btn primary" id="yes">Đã nhớ ✓</button></div>`;
  $('#fc').onclick=()=>{flipped=!flipped;drawFlash(L)};
  $('#no').onclick=()=>{learned.delete(keyOf(L.id,w.w));logAct('flash');persist();fi++;flipped=false;drawFlash(L)};
  $('#yes').onclick=()=>{learned.add(keyOf(L.id,w.w));logAct('flash');persist();fi++;flipped=false;drawFlash(L)};
}

/* ---------- QUIZ ---------- */
let qs=[],qi=0,score=0;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function startQuiz(L){
  const pool=shuffle(L.words).slice(0,10); qi=0;score=0;
  qs=pool.map((w,i)=>{
    const others=shuffle(L.words.filter(x=>x!==w)).slice(0,3);
    const type=i%3;
    if(type===0) return {q:`<b>${esc(w.w)}</b> <span class="ipa">/${w.ipa}/</span> nghĩa là gì?`,opts:shuffle([w,...others]).map(x=>x.vi),ans:w.vi,w};
    if(type===1) return {q:`Từ nào nghĩa là “${esc(w.vi)}”?`,opts:shuffle([w,...others]).map(x=>x.w),ans:w.w,w};
    const s=L.story.find(s=>[...s[0].matchAll(/\{([^}|]+)(?:\|([^}]+))?\}/g)].some(m=>(m[2]||m[1])===w.w));
    let sur=w.w; const txt=s[0].replace(/\{([^}|]+)(?:\|([^}]+))?\}/g,(m,su,le)=>{if((le||su)===w.w){sur=su;return '_____'}return su});
    return {q:`Điền vào chỗ trống:<br><span class="ex">${esc(txt)}</span>`,opts:shuffle([sur,...others.map(x=>x.w)]),ans:sur,w};
  });
  drawQ(L);
}
function drawQ(L){
  const p=$('#panel');
  if(qi>=qs.length){logAct('quiz');persist();p.innerHTML=`<section class="card" style="text-align:center"><span class="eyebrow">Kết quả</span><div class="score">${score}/${qs.length}</div><p>${score>=8?'Rất tốt! Các từ trả lời đúng đã được đánh dấu đã thuộc.':'Hãy đọc lại truyện và ôn thẻ nhớ rồi thử lại nhé.'}</p><button class="btn primary" id="again">Làm bài mới</button></section>`;$('#again').onclick=()=>startQuiz(L);return}
  const Q=qs[qi];
  p.innerHTML=`<div class="count">Câu ${qi+1} / ${qs.length} · Đúng ${score}</div><section class="card"><div class="q">${Q.q}</div><div class="opts">${Q.opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="fb"></div></section>`;
  p.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(p.querySelector('.right'))return;
    const ok=b.dataset.o===Q.ans;
    p.querySelectorAll('.opt').forEach(x=>{if(x.dataset.o===Q.ans)x.classList.add('right')});
    if(ok){score++;learned.add(keyOf(L.id,Q.w.w));persist()}else b.classList.add('wrong');
    speak(Q.w.w);
    $('#fb').innerHTML=`<p style="margin:6px 0 0"><b>${esc(Q.w.w)}</b> <span class="ipa">/${Q.w.ipa}/</span> – ${esc(Q.w.vi)}</p><button class="btn primary" style="width:100%;margin-top:8px" id="nx">Câu tiếp</button>`;
    $('#nx').onclick=()=>{qi++;drawQ(L)};
  });
}

    <div style="font-size:17px">${esc(x.vi)}</div>
    <div class="ex muted">${exampleFor(L,w)}</div>
    <div class="fc-actions"><button class="btn" data-close>Đóng</button><button class="btn primary" data-learn="${esc(k)}" aria-pressed="${learned.has(k)}">${learned.has(k)?'Bỏ đánh dấu':'Đã thuộc ✓'}</button></div></div>`;
  speak(x.w);
}
const closeSheet=()=>{$('#sheetHost').innerHTML=''};

/* ---------- EVENTS ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-close]'); if(!t)return;
  if(t.dataset.say!==undefined){speak(t.dataset.say);return}
  if(t.dataset.rec!==undefined){pronounce(t.dataset.rec);return}
  if(t.dataset.pin!==undefined){const k=state.id+':'+t.dataset.pin; PINS.has(k)?PINS.delete(k):PINS.add(k); persist(); renderTab(); return}
  if(t.dataset.line!==undefined){const L=LESSONS.find(l=>l.id===state.id); if(L) playLine(L,t.dataset.line); return}
  if(t.dataset.reps){SH.reps=+t.dataset.reps; document.querySelectorAll('[data-reps]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.reps===SH.reps)); return}
  if(t.dataset.shrec!==undefined){shadowRec(LESSONS.find(l=>l.id===state.id),+t.dataset.shrec); return}
  if(t.dataset.ptone!==undefined){pronOne(LESSONS.find(l=>l.id===state.id),t.dataset.ptone); return}
  if(t.dataset.close!==undefined){closeSheet();return}
  if(t.dataset.learn){const k=t.dataset.learn;learned.has(k)?learned.delete(k):learned.add(k);logAct('learn');persist();const inSheet=t.closest('.sheet');closeSheet();refresh();if(inSheet)return;return}
  if(t.dataset.w){openSheet(t.dataset.l,t.dataset.w);return}
  if(t.dataset.open){lesson(t.dataset.open,t.dataset.opentab);return}
  if(t.dataset.cal!==undefined){calM=null;calView();return}
  if(t.dataset.calm){calM=new Date(calM.getFullYear(),calM.getMonth()+(+t.dataset.calm),1);calView();return}
  if(t.dataset.home!==undefined){home();return}
  if(t.dataset.ox!==undefined){oxView();window.scrollTo(0,0);return}
  if(t.dataset.oxlv){ox.lv=t.dataset.oxlv;ox.n=150;oxView();return}
  if(t.dataset.oxst){ox.st=t.dataset.oxst;ox.n=150;oxView();return}
  if(t.dataset.tab){SH.run=false;if(CH&&CH.lid!==state.id)CH=null;state.tab=t.dataset.tab;renderTab();return}
  if(t.dataset.tense){state.tense=+t.dataset.tense;renderTab();return}
  if(t.dataset.sent!==undefined){playSent(LESSONS.find(l=>l.id===state.id),+t.dataset.sent);return}
  if(t.dataset.rate){rate=+t.dataset.rate;if(AUD.el)AUD.el.playbackRate=rate;document.querySelectorAll('[data-rate]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.rate===rate));return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
function refresh(){if(state.view==='cal'){calView()}else if(state.view==='home'){home()}else if(state.view==='ox'){drawOx()}else if(!['flash','quiz'].includes(state.tab))renderTab()}
const start=()=>{const h=(location.hash||'').slice(1);LESSONS.some(l=>l.id===h)?lesson(h):home()};
start();
cloudInit();
</script>

</html>
