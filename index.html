const TARGET=OX.length, KEY='linh3000.learned';
let learned=new Set();
try{learned=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){}
function persistLocal(){try{localStorage.setItem(KEY,JSON.stringify([...learned]))}catch(e){}}
function persist(){persistLocal();cloudSave()}
/* ---- Lưu tiến độ vào tài khoản Claude (đồng bộ mọi thiết bị) ---- */
const CLOUD={ref:null,state:'local',timer:null};
function setCloud(st){CLOUD.state=st;const el=document.getElementById('sync');if(el)el.innerHTML=syncHtml()}
function syncHtml(){return CLOUD.state==='ok'?'<span class="sync ok">☁ Đã lưu vào tài khoản Claude của bạn</span>':CLOUD.state==='saving'?'<span class="sync">☁ Đang lưu…</span>':CLOUD.state==='wait'?'<span class="sync">☁ Đang kết nối tài khoản…</span>':CLOUD.state==='err'?'<span class="sync warn">Chưa lưu được lên tài khoản, đang giữ trên máy này</span>':'<span class="sync warn">Chỉ lưu trên máy này. Dùng Sao lưu bên dưới để giữ tiến độ</span>'}
function cloudSave(){if(!CLOUD.ref)return;clearTimeout(CLOUD.timer);setCloud('saving');CLOUD.timer=setTimeout(async()=>{try{await CLOUD.ref.set({learned:[...learned],updatedAt:Date.now()});setCloud('ok')}catch(e){setCloud('err')}},1200)}
async function cloudInit(){
  if(!(window.claude&&typeof window.claude.use==='function'))return;
  setCloud('wait');
  try{const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const uid=user?await user.id():null; if(!db||!uid){setCloud('local');return}
    const ref=db.doc('data/users/'+uid+'/progress'); const snap=await ref.get();
    const remote=snap.exists&&Array.isArray(snap.data().learned)?snap.data().learned:[];
    const before=learned.size; remote.forEach(k=>learned.add(k)); persistLocal();
    CLOUD.ref=ref;
    if(remote.length!==learned.size){ cloudSave() } else setCloud('ok');
    if(learned.size!==before) refresh();
  }catch(e){setCloud('local')}}
function backupCode(){return 'LINH3000:'+btoa(unescape(encodeURIComponent(JSON.stringify({v:1,learned:[...learned]}))))}
function restoreCode(txt){const m=(txt||'').trim().match(/^LINH3000:(.+)$/s); if(!m) throw 0; const o=JSON.parse(decodeURIComponent(escape(atob(m[1].trim())))); if(!Array.isArray(o.learned)) throw 0; let n=0; o.learned.forEach(k=>{if(typeof k==='string'&&!learned.has(k)){learned.add(k);n++}}); persist(); return n}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const allWords=LESSONS.flatMap(L=>L.words.map(w=>({...w,lid:L.id})));
const findWord=(lid,w)=>LESSONS.find(L=>L.id===lid).words.find(x=>x.w===w);
const keyOf=(lid,w)=>lid+'::'+w;
const lvB=lv=>lv?`<span class="lv ${lv}">${lv}</span>`:`<span class="lv x" title="Không có trong Oxford 3000">ngoài Ox</span>`;
const cov=new Map(); allWords.forEach(w=>{if(w.lv) cov.set((w.base||w.w).toLowerCase(),w)});
const oxLearned=()=>allWords.filter(w=>w.lv&&learned.has(keyOf(w.lid,w.w))).length;

/* Speech (giọng Anh Mỹ nếu máy có) */
const canSpeak='speechSynthesis' in window;
let usVoice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();usVoice=vs.find(v=>v.lang==='en-US'&&/Samantha|Google US|Aria|Jenny/i.test(v.name))||vs.find(v=>v.lang==='en-US')||vs.find(v=>/^en/.test(v.lang))||null}catch(e){}}
if(canSpeak){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
const WMAP={}; if(typeof WTIMINGS!=='undefined') Object.values(WTIMINGS).forEach(L=>Object.entries(L.w).forEach(([w,se])=>{const k=w.toLowerCase(); if(!WMAP[k]) WMAP[k]={f:L.file,s:se[0],e:se[1]}}));
const WA={el:null,end:0};
function wordEl(){ if(!WA.el){ WA.el=new Audio(); WA.el.preload='auto'; WA.el.setAttribute('playsinline',''); WA.el.addEventListener('timeupdate',()=>{ if(WA.el.currentTime>=WA.end) WA.el.pause() }) } return WA.el }
function toast(msg){let t=document.getElementById('toast'); if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)} t.textContent=msg; t.hidden=false; clearTimeout(t._h); t._h=setTimeout(()=>{t.hidden=true},4200)}
function speak(t,rate){
  const e=WMAP[String(t).trim().toLowerCase()];
  if(e){ const el=wordEl(); if(AUD.el&&!AUD.el.paused) AUD.el.pause();
    (async()=>{ try{ await ensure(el,e.f); WA.end=e.e; el.currentTime=e.s; await el.play() }catch(x){ toast(failMsg(x)) } })();
    return }
  if(!canSpeak){toast('Từ này chưa có file âm thanh trên thiết bị này.');return}
  oldSpeak(t,rate)}
function oldSpeak(t,rate){if(!canSpeak)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(usVoice)u.voice=usVoice;u.rate=rate||0.9;speechSynthesis.speak(u)}catch(e){}}
const sayBtn=(t,label)=>(canSpeak||WMAP[String(t).trim().toLowerCase()])?`<button class="${label?'say':'ic'}" data-say="${esc(t)}" aria-label="Nghe">${label||'🔊'}</button>`:'';

const plain=s=>s.replace(/\{([^}|]+)(?:\|[^}]+)?\}/g,'$1');
function marked(s,lid){return esc(s).replace(/\{([^}|]+)(?:\|([^}]+))?\}/g,(m,sur,lem)=>{lem=lem||sur;const ok=learned.has(keyOf(lid,lem));return `<button class="w${ok?' ok':''}" data-l="${lid}" data-w="${esc(lem)}">${sur}</button>`})}
function exampleFor(L,w){const s=L.story.find(s=>[...s[0].matchAll(/\{([^}|]+)(?:\|([^}]+))?\}/g)].some(m=>(m[2]||m[1])===w));return s?s[0].replace(/\{([^}|]+)(?:\|([^}]+))?\}/g,(m,sur,lem)=>(lem||sur)===w?'<b>'+sur+'</b>':sur):''}

function ring(p){const r=16,c=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="${r}" fill="none" stroke="var(--soft)" stroke-width="4"/><circle cx="20" cy="20" r="${r}" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 20 20)"/><text x="20" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${Math.round(p*100)}</text></svg>`}
const lessonDone=L=>L.words.filter(w=>learned.has(keyOf(L.id,w.w))).length;

const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function n2w(n){n=+n; if(n<20) return ONES[n]; if(n<100) return TENS[Math.floor(n/10)]+(n%10?' '+ONES[n%10]:''); if(n<1000) return ONES[Math.floor(n/100)]+' hundred'+(n%100?' '+n2w(n%100):''); if(n<1e6) return n2w(Math.floor(n/1000))+' thousand'+(n%1000?' '+n2w(n%1000):''); return String(n)}
function toks(s){return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/\bwon't\b/g,'will not').replace(/\bcan't\b/g,'can not').replace(/\bcannot\b/g,'can not').replace(/n't\b/g,' not').replace(/'ve\b/g,' have').replace(/'re\b/g,' are').replace(/'ll\b/g,' will').replace(/\bi'm\b/g,'i am').replace(/'d\b/g,' would').replace(/\blet's\b/g,'let us').replace(/(\d+)(st|nd|rd|th)\b/g,'$1').replace(/\$(\d+)/g,'$1 dollars').replace(/%/g,' percent').replace(/\d+/g,m=>' '+n2w(m)+' ').replace(/[-–—]/g,' ').replace(/[^a-z' ]+/g,' ').split(/\s+/).map(w=>w.replace(/^'+|'+$/g,'')).filter(Boolean)}
const SAME={to:'two',too:'two',for:'four',ok:'okay',mr:'mister',ms:'miz',t:'tee'};
const eq=(a,b)=>a===b||(SAME[a]||a)===(SAME[b]||b)||a.replace(/'/g,'')===b.replace(/'/g,'');
function align(target,heard){const n=target.length,m=heard.length,d=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=eq(target[i],heard[j])?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  const ok=new Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(eq(target[i],heard[j])){ok[i]=true;i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++}return ok}
let REC=null;
function pronounce(text){
  const target=toks(text), words=String(text).replace(/[“”"]/g,'').split(/\s+/).filter(Boolean);
  $('#sheetHost').innerHTML=`<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-label="Luyện phát âm">
    <span class="eyebrow">Luyện phát âm</span>

    <div class="fc-actions"><button class="btn" data-close>Đóng</button><button class="btn primary" id="prAgain" hidden>Thử lại</button></div></div>`;
  const go=$('#prGo'),st=$('#prS'),hd=$('#prH'),again=$('#prAgain');
  const start=()=>{ if(REC){try{REC.abort()}catch(e){}} if(AUD.el)AUD.el.pause(); if(WA.el)WA.el.pause();
    const r=new SRx(); REC=r; r.lang='en-US'; r.interimResults=true; r.maxAlternatives=5; r.continuous=false;
    let finals=[], interim='';
    go.classList.add('on'); st.textContent='Đang nghe… hãy đọc'; hd.textContent=''; again.hidden=true;
    r.onresult=ev=>{interim='';for(let k=ev.resultIndex;k<ev.results.length;k++){const res=ev.results[k]; if(res.isFinal){finals.push([...res].map(a=>a.transcript))} else interim+=res[0].transcript} hd.textContent=interim?'Máy nghe: '+interim:''};
    r.onerror=ev=>{go.classList.remove('on'); again.hidden=false;
      st.textContent=ev.error==='not-allowed'||ev.error==='service-not-allowed'?'Chưa cho phép dùng micro. Vào Cài đặt → Safari → Micrô, chọn Cho phép, rồi thử lại.':ev.error==='no-speech'?'Không nghe thấy tiếng. Đưa điện thoại gần miệng hơn và thử lại.':ev.error==='network'?'Cần có mạng để nhận giọng nói.':'Có lỗi ('+ev.error+'). Thử lại nhé.'};

      const alts=finals.length===1?finals[0]:[finals.map(f=>f[0]).join(' ')];

    <div class="toolbar"><button class="pill" id="tipa" aria-pressed="${showIpa}">IPA dưới câu</button><button class="pill" id="tv" aria-pressed="${showVi}">Bản dịch</button><span class="muted" style="font-size:13px">${lessonDone(L)}/${L.words.length} từ đã thuộc</span></div>
    <article class="story">${L.story.map((s,i)=>{const who=[...new Set(s[4].filter(g=>g.sp!=='narrator').map(g=>g.sp))];return `<div class="sent" data-i="${i}">${who.length?`<div class="spk-row">${who.map(sp=>`<span class="spk sp-${sp}">${SPEAKERS[sp].name}</span>`).join('')}</div>`:''}<div class="en">${marked(s[0],L.id)}</div>${showIpa?`<div class="sipa">/${esc(s[3])}/</div>`:''}${showVi?`<div class="vi">${esc(s[1])}</div>`:''}<div class="sent-tools"><span class="g">${esc(s[2])}</span><button class="say" data-sent="${i}">🔊 câu</button>${micBtn(plain(s[0]),'🎤 đọc')}</div></div>`}).join('')}</article>`;
    $('#tv').onclick=()=>{showVi=!showVi;renderTab()};
    $('#tipa').onclick=()=>{showIpa=!showIpa;try{localStorage.setItem('linh3000.ipa',showIpa?'1':'0')}catch(e){}renderTab()};
    $('#playAll').onclick=()=>playAll(L);
    const d=$('#dl'); if(d) d.onclick=()=>downloadMp3(L);
    markNow();
  }
  if(state.tab==='words'){p.innerHTML=`<div class="list">${L.words.map(w=>rowHtml({...w,lid:L.id})).join('')}</div>`}
  if(state.tab==='grammar'){
    p.innerHTML=`<section class="card"><span class="eyebrow">Đổi thì cùng một câu</span>
      <div class="tense-sent" id="ts">${esc(L.drill[state.tense])}</div>
      <div class="chips">${TENSES.map((t,i)=>`<button class="chip" data-tense="${i}" aria-pressed="${i===state.tense}">${t}</button>`).join('')}</div>
      <div class="sent-tools">${sayBtn(L.drill[state.tense],'🔊 nghe câu')}${micBtn(L.drill[state.tense],'🎤 đọc')}</div></section>
      ${L.structures.map(s=>`<section class="card"><span class="eyebrow">Cấu trúc trong truyện</span><div class="pattern">${esc(s[0])}</div><div class="ex">${esc(s[1])}</div><div class="muted">${esc(s[2])}</div></section>`).join('')}
      <section class="card"><span class="eyebrow">Các thì xuất hiện trong truyện</span>${L.story.map(s=>`<div style="font-size:14px"><span class="g">${esc(s[2])}</span> <span class="ex">${esc(plain(s[0]))}</span></div>`).join('')}</section>`;
  }
  if(state.tab==='family'){
    p.innerHTML=L.family.map(f=>`<section class="card"><div class="fam-root">${esc(f.root)}</div><div class="fam">${f.forms.map(x=>`<div class="fam-row"><b>${esc(x.w)}</b><span class="meta"><span class="pos" style="margin:0 6px 0 0">${x.p}</span>${x.lv?lvB(x.lv)+' ':''}<span class="ipa">/${x.ipa}/</span><br>${esc(x.vi)}</span>${sayBtn(x.w)}</div>`).join('')}</div></section>`).join('');
  }
  if(state.tab==='flash'){startFlash(L)}
  if(state.tab==='quiz'){startQuiz(L)}
}

/* ---------- FLASHCARDS ---------- */
let deck=[],fi=0,flipped=false;
function startFlash(L){deck=[...L.words].sort((a,b)=>learned.has(keyOf(L.id,a.w))-learned.has(keyOf(L.id,b.w))||Math.random()-.5);fi=0;flipped=false;drawFlash(L)}
function drawFlash(L){
  const p=$('#panel');
  if(fi>=deck.length){p.innerHTML=`<section class="card" style="text-align:center"><div class="score">${lessonDone(L)}/${L.words.length}</div><p>Bạn đã xem hết bộ thẻ. Số từ đã thuộc trong chương này ở trên.</p><button class="btn primary" id="again">Ôn lại từ đầu</button></section>`;$('#again').onclick=()=>startFlash(L);return}
  const w=deck[fi];
  p.innerHTML=`<div class="count">Thẻ ${fi+1} / ${deck.length} · chạm thẻ để lật</div>
  <button class="fc" id="fc">${flipped?`<div style="display:grid;gap:8px"><span class="big" style="font-size:26px">${esc(w.vi)}</span><span class="ipa">${esc(w.w)} · /${w.ipa}/</span><span class="ex">${exampleFor(L,w.w)}</span></div>`:`<div style="display:grid;gap:6px"><span class="big">${esc(w.w)}</span><span class="ipa">/${w.ipa}/</span><span class="muted">${w.p}</span></div>`}</button>
  <div class="toolbar" style="justify-content:center">${sayBtn(w.w,'🔊 nghe từ')}</div>
  <div class="fc-actions"><button class="btn" id="no">Chưa nhớ</button><button class="btn primary" id="yes">Đã nhớ ✓</button></div>`;
  $('#fc').onclick=()=>{flipped=!flipped;drawFlash(L)};
  $('#no').onclick=()=>{learned.delete(keyOf(L.id,w.w));persist();fi++;flipped=false;drawFlash(L)};
  $('#yes').onclick=()=>{learned.add(keyOf(L.id,w.w));persist();fi++;flipped=false;drawFlash(L)};
}

/* ---------- QUIZ ---------- */
let qs=[],qi=0,score=0;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function startQuiz(L){
  const pool=shuffle(L.words).slice(0,10); qi=0;score=0;
  qs=pool.map((w,i)=>{
    const others=shuffle(L.words.filter(x=>x!==w)).slice(0,3);
    const type=i%3;
    if(type===0) return {q:`<b>${esc(w.w)}</b> <span class="ipa">/${w.ipa}/</span> nghĩa là gì?`,opts:shuffle([w,...others]).map(x=>x.vi),ans:w.vi,w};
    if(type===1) return {q:`Từ nào nghĩa là “${esc(w.vi)}”?`,opts:shuffle([w,...others]).map(x=>x.w),ans:w.w,w};
    const s=L.story.find(s=>[...s[0].matchAll(/\{([^}|]+)(?:\|([^}]+))?\}/g)].some(m=>(m[2]||m[1])===w.w));
    let sur=w.w; const txt=s[0].replace(/\{([^}|]+)(?:\|([^}]+))?\}/g,(m,su,le)=>{if((le||su)===w.w){sur=su;return '_____'}return su});
    return {q:`Điền vào chỗ trống:<br><span class="ex">${esc(txt)}</span>`,opts:shuffle([sur,...others.map(x=>x.w)]),ans:sur,w};
  });
  drawQ(L);
}
function drawQ(L){
  const p=$('#panel');
  if(qi>=qs.length){p.innerHTML=`<section class="card" style="text-align:center"><span class="eyebrow">Kết quả</span><div class="score">${score}/${qs.length}</div><p>${score>=8?'Rất tốt! Các từ trả lời đúng đã được đánh dấu đã thuộc.':'Hãy đọc lại truyện và ôn thẻ nhớ rồi thử lại nhé.'}</p><button class="btn primary" id="again">Làm bài mới</button></section>`;$('#again').onclick=()=>startQuiz(L);return}
  const Q=qs[qi];
  p.innerHTML=`<div class="count">Câu ${qi+1} / ${qs.length} · Đúng ${score}</div><section class="card"><div class="q">${Q.q}</div><div class="opts">${Q.opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="fb"></div></section>`;
  p.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(p.querySelector('.right'))return;
    const ok=b.dataset.o===Q.ans;
    p.querySelectorAll('.opt').forEach(x=>{if(x.dataset.o===Q.ans)x.classList.add('right')});
    if(ok){score++;learned.add(keyOf(L.id,Q.w.w));persist()}else b.classList.add('wrong');
    speak(Q.w.w);
    $('#fb').innerHTML=`<p style="margin:6px 0 0"><b>${esc(Q.w.w)}</b> <span class="ipa">/${Q.w.ipa}/</span> – ${esc(Q.w.vi)}</p><button class="btn primary" style="width:100%;margin-top:8px" id="nx">Câu tiếp</button>`;
    $('#nx').onclick=()=>{qi++;drawQ(L)};
  });
}

/* ---------- WORD SHEET ---------- */
function openSheet(lid,w){
  const x=findWord(lid,w), L=LESSONS.find(l=>l.id===lid), k=keyOf(lid,w);
  $('#sheetHost').innerHTML=`<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-label="${esc(w)}">
    <span class="eyebrow">${L.vi} · ${x.p} ${lvB(x.lv)}${x.base?` <span style="text-transform:none;letter-spacing:0">(từ gốc Oxford: ${esc(x.base)})</span>`:''}</span>
    <div class="sheet-row"><span class="big">${esc(x.w)}</span>${sayBtn(x.w)}${micBtn(x.w)}</div>
    <div class="ipa" style="font-size:20px">/${x.ipa}/</div>
    <div style="font-size:17px">${esc(x.vi)}</div>
    <div class="ex muted">${exampleFor(L,w)}</div>
    <div class="fc-actions"><button class="btn" data-close>Đóng</button><button class="btn primary" data-learn="${esc(k)}" aria-pressed="${learned.has(k)}">${learned.has(k)?'Bỏ đánh dấu':'Đã thuộc ✓'}</button></div></div>`;
  speak(x.w);
}
const closeSheet=()=>{$('#sheetHost').innerHTML=''};

/* ---------- EVENTS ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-close]'); if(!t)return;
  if(t.dataset.say!==undefined){speak(t.dataset.say);return}
  if(t.dataset.rec!==undefined){pronounce(t.dataset.rec);return}
  if(t.dataset.close!==undefined){closeSheet();return}
  if(t.dataset.learn){const k=t.dataset.learn;learned.has(k)?learned.delete(k):learned.add(k);persist();const inSheet=t.closest('.sheet');closeSheet();refresh();if(inSheet)return;return}
  if(t.dataset.w){openSheet(t.dataset.l,t.dataset.w);return}
  if(t.dataset.open){lesson(t.dataset.open);return}
  if(t.dataset.home!==undefined){home();return}
  if(t.dataset.ox!==undefined){oxView();window.scrollTo(0,0);return}
  if(t.dataset.oxlv){ox.lv=t.dataset.oxlv;ox.n=150;oxView();return}
  if(t.dataset.oxst){ox.st=t.dataset.oxst;ox.n=150;oxView();return}
  if(t.dataset.tab){state.tab=t.dataset.tab;renderTab();return}
  if(t.dataset.tense){state.tense=+t.dataset.tense;renderTab();return}
  if(t.dataset.sent!==undefined){playSent(LESSONS.find(l=>l.id===state.id),+t.dataset.sent);return}
  if(t.dataset.rate){rate=+t.dataset.rate;if(AUD.el)AUD.el.playbackRate=rate;document.querySelectorAll('[data-rate]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.rate===rate));return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
function refresh(){if(state.view==='home'){home()}else if(state.view==='ox'){drawOx()}else if(!['flash','quiz'].includes(state.tab))renderTab()}
const start=()=>{const h=(location.hash||'').slice(1);LESSONS.some(l=>l.id===h)?lesson(h):home()};
start();
cloudInit();
</script>
</html>
